# ============================================================
# HOME — textos e ORDEM dos blocos
# ------------------------------------------------------------
# Para reordenar: mude a ordem das linhas em "secoes".
# Para esconder um bloco: apague a linha (ou comente com #).
# Regra da marca: violeta e verde nunca encostam. Por isso
# "resultados" (verde) fica depois de "equipe" (preto) e nunca
# ao lado de "metodo" ou "orcamento" (violeta).
# Ordem definida na análise da home (13/10/2026): promessa e
# prova nas 2 primeiras telas, preço completo depois do valor.
# ============================================================
secoes:
  - hero
  - barra-prova
  - checklist
  - servicos
  - metodo
  - equipe
  # resultados: só aparece quando houver case aprovado (cases.yml). Os números já estão na barra-prova.
  - resultados
  # portfolio: escondido até haver trabalhos reais autorizados. Para voltar, troque as imagens em portfolio.yml e tire o "#".
  # - portfolio
  - planos
  - duvidas
  - orcamento

seo:
  titulo: Olorin Digital | Agência de marketing em Curitiba
  descricao: Anúncio, conteúdo, site e impresso feitos pelo mesmo time de 3 especialistas. Preço aberto e Raio-X gratuito da sua marca.

hero:
  linha_superior: Agência de marketing digital · Curitiba para todo o Brasil
  titulo_1: Não é sobre aparecer.
  titulo_2: É sobre
  titulo_destaque: vender.
  paragrafo: Anúncio, conteúdo, site e impresso feitos pelo mesmo time de 3 especialistas. Sua marca fala a mesma língua em todo lugar, e você vê quanto cada real investido trouxe de volta.
  botao: Quero meu Raio-X gratuito
  botao_sem_diagnostico: Pedir orçamento
  botao_destino: "#orcamento"
  link_whatsapp: ou fale no WhatsApp
  microtexto: 30 min por vídeo + PDF em até 48 h · Sem compromisso
  prova:
    - "Preço aberto: a partir de R$ 800"
    - Sem multa após 3 meses
    - Relatório mensal com faturamento
  janela: relatorio.exe
  janela_rotulo: Vendas do mês

barra_prova:
  titulo: A Olorin em números

# Usado nas páginas de serviço (formulário logo abaixo do banner). Não aparece mais na home.
formulario_topo:
  titulo: Raio-X Olorin gratuito
  texto: Conte rapidinho quem você é. A gente olha anúncio, redes, site e material da marca e te diz onde está travando e por onde vale começar.
  detalhe: "Como funciona: uma conversa de 30 minutos por vídeo e, em até 48 horas, um PDF de 1 página com os 3 problemas que mais travam a sua venda e as 3 ações para começar."
  itens:
    - 30 minutos por vídeo
    - PDF com 3 problemas e 3 ações em 48 horas
    - Sem compromisso e com preço aberto na proposta

checklist:
  etiqueta: Checklist rápido
  titulo: Se você se reconhece aqui, o problema não é falta de esforço.
  dica: Marque o que acontece com você.
  itens:
    - Você tem um fornecedor pro anúncio, outro pro post e outro pra arte, e nenhum conversa com o outro.
    - Você investe todo mês e não sabe dizer quanto custou cada venda.
    - O relatório mostra alcance e curtida, mas nunca mostra faturamento.
    - "Cada peça parece de uma empresa diferente: o anúncio, o feed, o site e o cartão de visita."
  contador_um: marcado
  contador_varios: marcados
  resposta_titulo: Isso tem solução, e não é trabalhar mais.
  resposta: Quando anúncio, conteúdo, site e impresso são feitos por gente que não conversa, cada um puxa para um lado. Com o mesmo time cuidando de tudo, a marca fala uma língua só e cada real investido aparece no relatório.
  resposta_padrao: Se você marcou dois ou mais, a gente começa pelo Raio-X.
  cta: Ver o que a gente faz
  cta_destino: "#servicos"

servicos:
  etiqueta: O que a Olorin faz
  titulo: A marca inteira, não só o anúncio.
  texto: Contrate uma frente só ou junte várias. Quando elas rodam juntas, uma empurra a outra.
  ver_detalhes: Ver detalhes
  faixa_texto: Não sabe por onde começar?
  faixa_botao: Perguntar no WhatsApp

metodo:
  curto: true
  etiqueta: Método Olorin
  titulo: Quatro etapas. Zero achismo.
  texto: "Sem caixa-preta: você sabe o que está sendo feito, por quê e quanto está voltando."
  link_mais:
    texto: Ver como trabalhamos
    url: /como-trabalhamos/
  # "texto" aparece na página Como trabalhamos e no Sobre; "resumo" aparece na home.
  etapas:
    - nome: Raio-X
      resumo: Olhamos anúncio, redes, site e material da marca antes de criar qualquer coisa.
      texto: Olhamos tudo o que já existe, da conta de anúncio às redes, ao site e ao material da marca. Antes de criar qualquer coisa, descobrimos o que está travando.
    - nome: Direção
      resumo: Definimos o que falar, para quem, em qual canal e com qual cara.
      texto: Estratégia e identidade alinhadas, com o que falar, para quem, em qual canal e com qual cara. Uma marca só, em todos os pontos de contato.
    - nome: Execução
      resumo: Campanha, conteúdo, site e impresso saindo pela mesma porta, no mesmo ritmo.
      texto: Campanha no ar, conteúdo publicado, arquivo fechado para a gráfica e site no ar. Tudo saindo pela mesma porta, no mesmo ritmo.
    - nome: Leitura
      resumo: Relatório com quanto entrou, quanto saiu e o que vem na próxima rodada.
      texto: Relatório que qualquer pessoa entende, com quanto entrou, quanto saiu, qual foi o retorno e o que vem na próxima rodada.
  cta_texto: Quer saber em qual dessas etapas sua marca está travada?
  cta: Pedir meu Raio-X
  cta_destino: "#orcamento"

resultados:
  ocultar_numeros: true
  etiqueta: Resultados
  titulo: Número é a única coisa que não dá pra maquiar.
  janela_prefixo: case_

