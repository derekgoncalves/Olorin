# ============================================================
# HOME — textos e ORDEM dos blocos
# ------------------------------------------------------------
# Ordem fixada pelo dono (17/10/2026): 1 banner, 2 faixa de logos (logo abaixo do banner),
# 3 resultados (números e portfólio), 4 serviços, 5 calculadora, 6 quem somos,
# 7 RAIO X DA OLORIN (o formulário do fim, igual em todas as páginas).
# Saíram da home em 17/10/2026: o Raio-X do meio, o checklist, o método, o blog e as dúvidas.
# Toda chamada da home é o botão do Raio-X, que leva ao formulário do fim (#raio-x).
# Regra da marca: violeta e verde nunca encostam. Cores dos blocos, em ordem:
# preto, branco, verde+branco, preto, branco, preto, violeta.
# ============================================================
secoes:
  - hero
  - faixa-clientes
  - resultados
  - servicos
  - calculadora
  - equipe
  - orcamento

seo:
  titulo: Olorin Digital | Agência de marketing digital
  descricao: "Do clique ao cliente. Anúncios, redes, marca, site, impressos e dados num time só, como se você fosse o único cliente. Peça o seu Raio-X gratuito."

hero:
  linha_superior: Agência de marketing digital
  # Título: "Do clique" na 1ª linha e "ao cliente." na 2ª, com "cliente." em verde.
  titulo_1: Do clique
  titulo_2: ao
  titulo_destaque: cliente.
  botao: Quero meu Raio-X grátis
  prova:
    - Sem multa depois de 3 meses
    - Relatório todo mês
  janela: relatorio.olo
  janela_rotulo: Resultado do mês
  aviso_clique: Novo cliente
  # Usados por outras páginas (não aparecem na home): texto do botão sem a oferta do Raio-X,
  # link de WhatsApp e o atalho de telefone das páginas de serviço, até elas trocarem pelo botão do Raio-X.
  botao_sem_diagnostico: Pedir orçamento
  link_whatsapp: ou fale agora no WhatsApp
  atalho:
    rotulo: Seu WhatsApp com DDD
    placeholder: (41) 99999-9999
    botao: Quero meu Raio-X grátis
    ajuda: Leva 1 minuto. Depois, 30 min por vídeo e um PDF em até 48 h.

# Faixa de logos (secoes/faixa-clientes.njk, em todas as páginas). Os logos vêm de clientes.yml.
# A credencial é da Natalia (gestora de tráfego parceira Meta e Google), nunca selo da agência.
faixa_clientes:
  credencial_antes: Tráfego com a
  credencial_nome: Natalia
  credencial_link: /quem-somos/natalia-arruda/
  credencial_depois: ", gestora parceira Meta e Google"

resultados:
  etiqueta: Resultados
  titulo: Provas, não promessas.
  texto: O que o nosso time já fez.
  cases_etiqueta: Cases
  cases_titulo: De perto.
  case_link: Ver o serviço
  portfolio_etiqueta: Portfólio
  portfolio_titulo: Marcas atendidas.
  portfolio_texto: Identidade, redes, impressos, sites e campanhas feitos pelo nosso time.
  filtro_todos: Tudo
  limite: 6
  link_mais:
    texto: Ver o portfólio completo
    url: /portfolio/
  botao_instagram: Ver mais no Instagram

# Na home os cards mostram só ícone, nome e link (a descrição fica na página de cada serviço).
servicos:
  titulo: O que a Olorin faz
  ver_detalhes: Ver o serviço
  faixa_texto: Não sabe por onde começar?

# A calculadora tem textos próprios em src/content/calculadora.yml.

equipe:
  etiqueta: Quem toca
  titulo: Fale com quem coordena.
  texto: Cada frente tem alguém que coordena e responde por ela. Você fala com quem coordena, sem intermediário.
  botao: Falar com a equipe no WhatsApp
  link_sobre: Conheça quem somos
  ver_perfil: Ver perfil

# Seção final RAIO X DA OLORIN (secoes/orcamento.njk): a mesma em todas as páginas, menos a Educação.
orcamento:
  titulo: RAIO X DA OLORIN
  passos:
    - Você conta quem é
    - A gente analisa tudo
    - Você recebe o plano
  janela: chapa.olo

# ------------------------------------------------------------
# Usados por outras páginas (não aparecem na home)
# ------------------------------------------------------------
# Lista da landing de campanha (/promo/).
formulario_topo:
  itens:
    - 30 minutos por vídeo
    - PDF com 3 pontos e 3 ações em até 48 horas
    - Sem compromisso

# Etapas do método: a página Sobre (antiga Como trabalhamos) e Quem somos leem daqui.
metodo:
  curto: true
  banner: true
  etiqueta: Método Olorin
  titulo: Quatro etapas. Zero achismo.
  texto: "Sem caixa-preta: você sabe o que está sendo feito, por quê e quanto voltou."
  link_mais:
    texto: Ver como trabalhamos
    url: /como-trabalhamos/
  # "texto" aparece na página Como trabalhamos; "resumo" aparece na versão curta.
  etapas:
    - nome: Raio-X
      resumo: Olhamos tudo o que já existe antes de criar qualquer coisa.
      texto: Olhamos tudo o que já existe, da conta de anúncio às redes, ao site e ao material da marca. Antes de criar qualquer coisa, descobrimos o que está travando.
    - nome: Direção
      resumo: O que falar, para quem, em qual canal e com qual cara.
      texto: Estratégia e identidade alinhadas, com o que falar, para quem, em qual canal e com qual cara. Uma marca só, em todos os pontos de contato.
    - nome: Execução
      resumo: Campanha, conteúdo, site e impresso no mesmo ritmo.
      texto: Campanha no ar, conteúdo publicado, arquivo fechado para a gráfica e site no ar. Tudo saindo pela mesma porta, no mesmo ritmo.
    - nome: Leitura
      resumo: Quanto entrou, quanto saiu e o que muda na próxima rodada.
      texto: Relatório que qualquer pessoa entende, com quanto entrou, quanto saiu, qual foi o retorno e o que vem na próxima rodada.
  cta_texto: Quer saber em qual etapa a sua marca está travada?
  cta: Pedir meu Raio-X
  cta_destino: "#raio-x"
