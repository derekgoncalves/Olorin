# ============================================================
# HOME — textos e ORDEM dos blocos
# ------------------------------------------------------------
# Ordem fixada pelo dono (13/10/2026): 1 banner, 2 resultados (números, logos,
# cases e portfólio), 3 serviços, 4 Raio-X (mini formulário), 5 planos (com a
# calculadora), 6 checklist, 7 método, 8 quem toca, 9 dúvidas, 10 formulário.
# Só checklist, método e dúvidas podem sair (comente a linha com #).
# Regra da marca: violeta e verde nunca encostam. Cores dos blocos, em ordem:
# preto, verde+branco, preto, violeta, branco, preto, violeta, preto, branco, violeta.
# ============================================================
secoes:
  - hero
  - resultados
  - servicos
  - raio-x
  - planos
  - checklist
  - metodo
  - equipe
  - duvidas
  - orcamento

seo:
  titulo: Olorin Digital | Agência de marketing em Curitiba
  descricao: Anúncio, redes sociais, identidade visual, site e impresso com o mesmo cuidado, da menor à maior organização. Preço aberto e Raio-X gratuito.

