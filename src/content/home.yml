    placeholder: (41) 99999-9999
    botao: Quero meu Raio-X grátis
    ajuda: Leva 1 minuto. Depois, 30 min por vídeo e um PDF em até 48 h.
  botao: Quero meu Raio-X grátis
  botao_sem_diagnostico: Pedir orçamento
  botao_destino: "#raio-x"
  link_whatsapp: ou fale agora no WhatsApp
  prova:
    - "Preço aberto: a partir de R$ 800"
    - Sem multa depois de 3 meses
    - Relatório todo mês
  janela: relatorio.exe
  janela_rotulo: Resultado do mês

# Usado nas páginas de serviço e na home (bloco 4). O mesmo formulário da etapa 1.
formulario_topo:
  etiqueta: Raio-X Olorin · gratuito
  titulo: Onde a sua marca trava?
  texto: Conte quem você é. A gente olha anúncio, redes, site e material da marca e mostra, sem rodeio, por onde vale começar.
  detalhe: "Como funciona: uma conversa de 30 minutos por vídeo e, em até 48 horas, um PDF de 1 página com os 3 pontos que mais travam o seu resultado e as 3 ações para começar."
  itens:
    - 30 minutos por vídeo
    - PDF com 3 pontos e 3 ações em até 48 horas
    - Sem compromisso, com preço aberto na proposta
  passos:
    - { num: "01", texto: Você conta quem é }
    - { num: "02", texto: A gente analisa tudo }
    - { num: "03", texto: Você recebe o plano }

