# Perguntas frequentes (PROMPT seção 12.6). A mesma fonte gera o HTML e o JSON-LD.
# Desde 17/10/2026 a FAQ completa aparece só na página /sobre/ (dono). Sem planos e sem preços (23/10/2026:
# nenhum valor no site; a pergunta de preço responde que o orçamento sai sob medida, depois do Raio-X).
# "id" é fixo (serve para links como /sobre/#faq-fidelidade e para o evento faq_open).
# Regra: no máximo 3 frases curtas por resposta. Texto proposto e ainda não confirmado
# fica marcado com "# PENDENTE:" na linha de cima (npm run pendencias).
perguntas:
  - id: faq-raio-x
    pergunta: O que é o Raio-X gratuito?
    resposta: Uma conversa de 30 minutos por vídeo sobre o seu anúncio, as suas redes, o seu site e o material da sua marca. Em até 48 horas, você recebe um PDF de 1 página com os 3 pontos que mais travam a sua venda e as 3 ações para começar. Sem compromisso.
  - id: faq-uma-frente
    pergunta: Dá para contratar um serviço só?
    resposta: Sim. Dá para contratar só redes sociais, só tráfego pago ou só um site, por exemplo, ou juntar várias frentes no mesmo time. Entregas pontuais, como um logotipo ou um impresso, também entram.
  - id: faq-preco
    pergunta: Quanto custa trabalhar com a Olorin?
    resposta: O site não lista preço, porque cada orçamento sai sob medida, depois do Raio-X gratuito da sua marca. O Raio-X mostra as frentes que fazem sentido agora, e a proposta chega por escrito, sem compromisso. A verba de anúncio é à parte e vai direto para as plataformas.
  - id: faq-segmento
    pergunta: Vocês atendem o meu tipo de organização?
    resposta: Atendemos empresas e organizações de todos os tipos e tamanhos, do pequeno negócio à indústria, da escola ao projeto cultural. Escolas e criadores de conteúdo têm páginas próprias, a [Olorin Educação](/educacao/) e a de [influenciadores](/influenciadores/).
  - id: faq-comecar-pequeno
    pergunta: Dá para começar pequeno?
    resposta: Dá. Você pode começar por uma entrega pontual ou por um serviço só e crescer depois. O Raio-X gratuito mostra por onde vale começar.
  - id: faq-verba-minima
    pergunta: Quanto preciso investir em anúncio para começar?
    resposta: Depende do objetivo, da região e da concorrência. Com pouca verba, as plataformas demoram mais para aprender, e no Raio-X a gente indica um valor que faça sentido para a sua marca. A verba vai direto para as plataformas, na sua conta.
  - id: faq-tempo-resultado
    pergunta: Em quanto tempo eu vejo resultado?
    resposta: Depende do objetivo. Campanha de venda, de matrícula ou de mensagem costuma dar os primeiros sinais em 2 a 4 semanas. Marca e conteúdo pedem de 2 a 3 meses de constância.
  - id: faq-fidelidade
    pergunta: Vocês trabalham com contrato de fidelidade?
    resposta: Nos serviços mensais, o contrato mínimo é de 3 meses. Depois, segue mês a mês, e para encerrar basta avisar com 30 dias, sem multa. Entregas pontuais e projetos de site não têm contrato mensal.
  - id: faq-arrependimento
    pergunta: Posso desistir depois de contratar?
    resposta: "Sim. Se você contratou a distância, pelo site, WhatsApp ou e-mail, pode desistir em até 7 dias da assinatura, com devolução do que pagou (art. 49 do Código de Defesa do Consumidor). Depois disso, vale o contrato: mínimo de 3 meses nos serviços mensais e, depois, aviso de 30 dias, sem multa."
  - id: faq-quem-cria
    pergunta: Quem cria as artes dos anúncios e dos posts?
    resposta: O time da Olorin, com direção de criação do Vinícius Mafra. Quando um projeto pede um especialista a mais, como fotografia, vídeo ou programação, a gente coordena tudo e responde pela entrega. Por isso o anúncio, o post e o impresso saem com a mesma cara.
  - id: faq-impressao
    pergunta: Vocês fazem a impressão ou só entregam o arquivo?
    resposta: Entregamos o arquivo fechado, pronto para a gráfica. Se precisar, indicamos gráficas parceiras e conferimos a prova com a gráfica antes de imprimir.
  - id: faq-a-distancia
    pergunta: Vocês atendem a distância?
    resposta: "Sim. Tudo é feito a distância: WhatsApp, reuniões por vídeo e aprovações por e-mail. Onde a sua marca estiver, o jeito de trabalhar é o mesmo."
  - id: faq-relatorio
    pergunta: Como é o relatório?
    resposta: "Todo mês você recebe um relatório com quanto investiu, quanto voltou, quanto custou cada resultado e o que muda na próxima rodada, em linguagem simples. Veja um [exemplo ilustrativo](/sobre/#relatorio)."
  - id: faq-dia-a-dia
    pergunta: Quem é o meu contato no dia a dia?
    resposta: O Derek Gonçalves, diretor de operações e relacionamento, é o seu primeiro contato, principalmente pelo WhatsApp. A Natalia Arruda dirige a estratégia, as mídias pagas, os dados e os relatórios, e o Vinícius Mafra dirige a criação e o design.
  - id: faq-troca-agencia
    pergunta: Já tenho agência. Como funciona a troca?
    # PENDENTE: confirmar como é a transição de outra agência (acessos, histórico, prazo)
    resposta: A gente faz a transição com você. Pedimos os acessos às contas de anúncio, às redes e ao site, guardamos o histórico e fazemos o Raio-X antes de mexer em qualquer coisa, para nada sair do ar no meio do caminho.
  - id: faq-sem-verba
    pergunta: E se eu ainda não tiver verba para anúncio?
    resposta: Sem problema. Dá para começar por uma entrega pontual, como logotipo, identidade visual ou um impresso, ou por um site. O Raio-X gratuito mostra o melhor primeiro passo.
  - id: faq-dono-contas
    pergunta: Quem é o dono das contas de anúncio, do site e dos arquivos?
    resposta: Você. As contas de anúncio, o domínio e o site ficam no nome da sua organização, e os arquivos finais são seus. A Olorin trabalha com acesso de parceiro, que você pode tirar quando quiser.
whatsapp: Perguntar no WhatsApp
