# Perguntas frequentes (PROMPT seção 12.6). A mesma fonte gera o HTML e o JSON-LD.
# A home mostra só as perguntas listadas em home.yml → duvidas.ids; a página /planos/ mostra todas.
# "id" é fixo (serve para links como /planos/#faq-verba-minima e para o evento faq_open).
# Regra: no máximo 3 frases curtas por resposta. Texto proposto e ainda não confirmado
# fica marcado com "# PENDENTE:" na linha de cima (npm run pendencias).
# Preços seguem o molde do dono (13/10/2026): pontual a partir de R$ 800, serviço mensal
# a partir de R$ 1.500, Gestão mensal R$ 2.500 (único preço fechado), Marketing 360 a partir
# de R$ 5.000, sites a partir de R$ 3.000, lojas virtuais a partir de R$ 10.000.
perguntas:
  - id: faq-raio-x
    pergunta: O que é o Raio-X gratuito?
    resposta: Uma conversa de 30 minutos por vídeo sobre o seu anúncio, as suas redes, o seu site e o material da sua marca. Em até 48 horas, você recebe um PDF de 1 página com os 3 pontos que mais travam o seu resultado e as 3 ações para começar. Sem compromisso.
  - id: faq-uma-frente
    pergunta: Dá para contratar um serviço só?
    resposta: Sim. Cada serviço mensal, como redes sociais ou tráfego pago, sai a partir de R$ 1.500 por mês, com contrato mínimo de 3 meses e implantação única de R$ 1.000. Entregas pontuais, como um logotipo ou um impresso, saem a partir de R$ 800.
  - id: faq-segmento
    pergunta: Vocês atendem o meu tipo de organização?
    resposta: Atendemos empresas e organizações de todos os tipos e tamanhos, do pequeno negócio à indústria, da escola ao projeto cultural. Educação é a nossa especialidade e tem uma frente própria, a [Olorin Educação](/educacao/).
  - id: faq-comecar-pequeno
    pergunta: Dá para começar pequeno?
    resposta: Dá. Você pode começar por uma entrega pontual, a partir de R$ 800, ou por um serviço mensal, a partir de R$ 1.500. O Raio-X gratuito mostra por onde vale começar.
  - id: faq-implantacao
    pergunta: O que é a taxa de implantação?
    resposta: "É o trabalho extra do primeiro mês, cobrado uma vez só: acessos, configuração das contas, rastreamento dos resultados e briefing inicial. Custa R$ 1.000 no serviço avulso e na Gestão mensal, e a partir de R$ 1.500 no Marketing 360. Dados contratado sozinho não tem implantação."
  - id: faq-verba-minima
    pergunta: Qual a verba mínima para começar a anunciar?
    resposta: Na Meta e no Google, recomendamos pelo menos R$ 1.500 por mês de verba de anúncio. Abaixo disso, as plataformas demoram mais para aprender e o resultado fica menos previsível. A verba vai direto para as plataformas, na sua conta.
  - id: faq-tempo-resultado
    pergunta: Em quanto tempo eu vejo resultado?
    resposta: Depende do objetivo. Campanha de venda, de matrícula ou de mensagem costuma dar os primeiros sinais em 2 a 4 semanas. Marca e conteúdo pedem de 2 a 3 meses de constância.
  - id: faq-fidelidade
    pergunta: Vocês trabalham com contrato de fidelidade?
    resposta: Nos formatos mensais (serviço avulso, Gestão mensal e Marketing 360), o contrato mínimo é de 3 meses. Depois, segue mês a mês, e para encerrar basta avisar com 30 dias, sem multa. Entregas pontuais e projetos de site não têm contrato mensal.
  - id: faq-quem-cria
    pergunta: Quem cria as artes dos anúncios e dos posts?
    resposta: O time da Olorin, com direção de criação do Vinicius Mafra. Quando um projeto pede um especialista a mais, como fotografia, vídeo ou programação, a gente coordena tudo e responde pelo resultado. Por isso o anúncio, o post e o impresso saem com a mesma cara.
  - id: faq-impressao
    pergunta: Vocês fazem a impressão ou só entregam o arquivo?
    resposta: Entregamos o arquivo fechado, pronto para a gráfica. Se precisar, indicamos gráficas parceiras e acompanhamos a prova com você.
  - id: faq-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim, atendemos todo o Brasil. Tudo é feito a distância: WhatsApp, reuniões por vídeo e aprovações por e-mail."
  - id: faq-relatorio
    pergunta: Como é o relatório?
    resposta: "Todo mês você recebe um relatório com quanto investiu, quanto voltou, quanto custou cada resultado e o que muda na próxima rodada. Na Gestão mensal, junto vem uma reunião de 30 minutos; no Marketing 360, reunião toda semana e planejamento estratégico todo mês. Veja um [exemplo ilustrativo](/como-trabalhamos/#relatorio)."
  - id: faq-dia-a-dia
    pergunta: Quem acompanha a minha conta no dia a dia?
    resposta: O Derek Gonçalves, diretor de operações e relacionamento, é o seu primeiro contato, principalmente pelo WhatsApp. A Natália Arruda dirige a estratégia e as mídias pagas, e o Vinicius Mafra dirige a criação e o design.
  - id: faq-troca-agencia
    pergunta: Já tenho agência. Como funciona a troca?
    # PENDENTE: confirmar como é a transição de outra agência (acessos, histórico, prazo)
    resposta: A gente faz a transição com você. Pedimos os acessos às contas de anúncio, às redes e ao site, guardamos o histórico e fazemos o Raio-X antes de mexer em qualquer coisa, para nada sair do ar no meio do caminho.
  - id: faq-sem-verba
    pergunta: E se eu ainda não tiver verba para anúncio?
    resposta: Sem problema. Dá para começar por uma entrega pontual, a partir de R$ 800, como logotipo, identidade visual ou um impresso, ou por um site, a partir de R$ 3.000. O Raio-X gratuito mostra o melhor primeiro passo.
  - id: faq-dono-contas
    pergunta: Quem é o dono das contas de anúncio, do site e dos arquivos?
    resposta: Você. As contas de anúncio, o domínio e o site ficam no nome da sua organização, e os arquivos finais são seus. A Olorin trabalha com acesso de parceiro, que você pode tirar quando quiser.
whatsapp: Perguntar no WhatsApp
