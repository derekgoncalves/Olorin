# Cases (PROMPT seção 12.2). Todos vão ao ar: home (Resultados), páginas de serviço e Olorin Educação.
# Regra: nenhum número inventado. O resultado de um case só entra quando o dono informar
# o número, o período e como foi medido. Até lá, o card mostra o que foi feito.
# "pagina: true" cria também /cases/<slug>/ e exige todos estes campos (o build avisa se faltar):
#   slug, segmento, situacao, o_que_fizemos (lista), resultado, periodo, servicos
# Campos do card:
#   cliente     nome do cliente
#   logo        arquivo em src/assets/clientes/ (no servidor: /assets/img/clientes/)
#   segmento    tipo de organização
#   servicos    slugs dos serviços (o case aparece na página de cada um)
#   resumo      o que a Olorin fez, em 1 frase
#   resultado   número curto (só confirmado); sem número, use "destaque" (texto curto)
#   detalhe     linha de apoio abaixo do número ou do destaque
itens:
  - slug: izeta
    cliente: Izeta
    logo: izeta.svg
    segmento: Educação
    janela: case_izeta.exe
    servicos_texto: Tráfego pago · Redes sociais · Dados
    servicos: [trafego-pago, redes-sociais, rastreamento-e-relatorio]
    # PENDENTE: confirmar o que a Olorin fez para a Izeta e enviar o resultado (número, período e como foi medido)
    resumo: Campanhas de matrícula, conteúdo para as redes e acompanhamento de cada contato que chegou.
    destaque: Captação de alunos
    detalhe: Turmas, campanhas e relatório de matrículas sob o mesmo cuidado.
  - slug: anacleto
    cliente: Anacleto
    logo: anacleto.svg
    segmento: Educação
    janela: case_anacleto.exe
    servicos_texto: Tráfego pago · Identidade visual · Redes sociais
    servicos: [trafego-pago, identidade-visual, redes-sociais]
    # PENDENTE: confirmar o que a Olorin fez para o Anacleto e enviar o resultado (número, período e como foi medido)
    resumo: Comunicação de matrícula com cara de marca, do anúncio ao feed.
    destaque: Marca e matrícula
    detalhe: Calendário de captação, peças e campanhas falando a mesma língua.
