# Cases (PROMPT seção 12.2).
# Dono, 14/10/2026: por enquanto a Olorin não mostra cases de destaque. A home e as páginas
# de serviço ficam sem o bloco de cases até haver resultados fortes. Para ligar de novo,
# troque "destaque_no_site" para true e preencha resumo, destaque e detalhe de cada case.
# A iZETA e o Dr. José Anacleto Abduch aparecem só de forma genérica: na Olorin Educação
# (bloco "Quem já atendemos", campos do bloco "edu") e no portfólio. Sem resultado e sem detalhe.
# Regra: nenhum número inventado. Resultado só com número, período e como foi medido.
# "pagina: true" cria também /cases/<slug>/ e exige: slug, segmento, situacao, o_que_fizemos
# (lista), resultado, periodo, servicos (o build avisa se faltar).
destaque_no_site: false
