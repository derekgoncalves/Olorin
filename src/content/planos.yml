# Planos e preços (PROMPT seção 2 e 12.5). Não alterar valores sem ordem do dono.
# Escopo em quantidades, Arranque 30 dias e taxa de implantação: plano de negócio aprovado pelo dono em 10/10/2026.
# 13/10/2026 (dono): Gestão a partir de R$ 2.500 sustenta clientes de ticket baixo e médio; 360 a partir de R$ 5.000
# é para quem quer mais e para clientes grandes. Loja virtual (e-commerce) a partir de R$ 10.000.
# "para" = linha curta de quem é o plano, logo abaixo do nome.
planos:
  - id: pontual
    nome: Pontual
    para: Uma entrega fechada, sem mensalidade
    de: A partir de
    valor: 800
    periodo: /projeto
    itens:
      - Uma entrega específica e fechada
      - Identidade visual, site ou impresso
      - Loja virtual (e-commerce) a partir de R$ 10.000
      - Auditoria da conta de anúncio
      - Prazo e escopo definidos no briefing
    selos: []
    servicos_preselecao: []
    calculadora: false
  - id: arranque-30-dias
    nome: Arranque 30 dias
    para: Para testar a Olorin antes de assinar
    tag: Para testar
    de: A partir de
    valor: 1800
    periodo: /uma vez
    itens:
      - Rastreamento instalado (GA4, pixel e conversões)
      - 1 campanha no ar na Meta ou no Google
      - 8 criativos de anúncio
      - Relatório com resultado no dia 30
    selos:
      - Sem contrato mensal
      - Valor abatido da implantação se continuar
    custo_total: "Verba de anúncio à parte, direto na sua conta (recomendamos a partir de R$ 1.500 no mês)"
    servicos_preselecao: [trafego-pago, rastreamento-e-relatorio]
    calculadora: false
  - id: gestao-mensal
    nome: Gestão mensal
    tag: Mais procurado
    destaque: true
    para: Para pequenas e médias marcas que querem constância
    de: A partir de
    valor: 2500
    periodo: /mês
    itens:
      - Meta Ads ou Google Ads
      - 8 criativos de anúncio por mês
      - 8 posts no feed por mês
      - Otimização semanal das campanhas
      - Relatório mensal + reunião de 30 minutos
    selos:
      - Sem multa após 3 meses
      - Relatório mensal
      - Otimização semanal
    implantacao: "Implantação única: R$ 1.000 (rastreamento, contas e briefing)"
    custo_total: "Com verba de anúncio: a partir de R$ 4.000/mês no total"
    servicos_preselecao: [trafego-pago, redes-sociais]
    calculadora: true
  - id: 360-completo
    nome: 360 completo
    tag: Para quem quer mais
    para: Para marcas maiores, com mais canais e mais volume
    de: A partir de
    valor: 5000
    periodo: /mês
    itens:
      - Meta Ads e Google Ads
      - 15 criativos de anúncio por mês
      - 12 posts + 4 Reels por mês
      - Site e material impresso sob o mesmo comando
      - Reunião estratégica mensal de 1 hora
      - Volume e canais sob medida acima disso
    selos:
      - Relatório mensal
      - Reunião estratégica mensal
    implantacao: "Implantação única: R$ 1.500 (rastreamento, contas e briefing)"
    custo_total: "Com verba de anúncio: a partir de R$ 6.500/mês no total"
    servicos_preselecao: [trafego-pago, redes-sociais, identidade-visual, material-impresso, site-e-loja-virtual]
    calculadora: true
botao: Quero esse
nota: Valores de gestão. A verba de anúncio (recomendamos a partir de R$ 1.500/mês) é investida à parte, direto nas plataformas Meta e Google.
contrato: Gestão mensal e 360 com contrato mínimo de 3 meses e taxa única de implantação. Depois, mês a mês com aviso de 30 dias. Sem multa rescisória.
total_entrada: "Custo total de entrada: a partir de R$ 4.000/mês (gestão R$ 2.500 + verba mínima recomendada de R$ 1.500)."
calculadora:
  titulo: Quanto custa começar?
  texto: Escolha o formato e quanto quer investir em anúncio. A conta aparece na hora.
  rotulo_plano: Formato
  rotulo_verba: Verba de anúncio por mês
  verbas: [1500, 3000, 5000, 10000]
  verba_minima: 1500
  resultado_prefixo: a partir de
  resultado_sufixo: por mês
  aviso: A verba vai direto para a Meta e o Google, na sua conta. A Olorin cobra só a gestão.
  tabela_titulo: Custo total por mês (gestão + verba)
