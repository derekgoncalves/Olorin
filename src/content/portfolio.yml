# ------------------------------------------------------------
# Tudo vai ao ar (dono, 13/10/2026). As imagens abaixo são ILUSTRATIVAS
# (fotos de banco de imagem, com títulos de tipo de trabalho, sem nome de cliente)
# e estão na lista de pendências para virar trabalho real.
#
# Campos:
#   titulo     tipo de trabalho (ou nome do cliente, quando for real e autorizado)
#   rotulo     linha pequena abaixo do título
#   imagem     id da imagem (src/assets/manifest.json ou manifest-<area>.json)
#   servicos   slugs dos serviços: o trabalho aparece no portfólio da página de cada um
#   link       opcional (site no ar, post no Instagram ou Behance)
#
# Para trocar uma imagem só pelo FTP (sem novo build): suba um arquivo com o MESMO
# nome em /assets/img/ (as larguras e formatos estão em docs/PENDENCIAS.md).
# ============================================================
