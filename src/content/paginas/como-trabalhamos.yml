# Página /como-trabalhamos/ — método completo, Raio-X passo a passo e relatório de exemplo.
# As 4 etapas do método vêm de src/content/home.yml → metodo.etapas (fonte única, campo "texto").
seo:
  titulo: Como trabalhamos | Método Olorin
  descricao: As 4 etapas do Método Olorin, como funciona o Raio-X gratuito e o relatório mensal que mostra faturamento, não só alcance.

etiqueta: Como trabalhamos
titulo: Sem caixa-preta.
sub: Você sabe o que está sendo feito, por quê e quanto está voltando. Do primeiro contato ao relatório de todo mês, o caminho é este, para qualquer frente e qualquer tamanho de marca.
janela: metodo.exe
janela_linhas:
  - Raio-X · gratuito
  - Relatório · todo mês

metodo:
  etiqueta: Método Olorin
  titulo: Quatro etapas. Zero achismo.
  texto: O mesmo caminho para qualquer frente que você contratar, de um anúncio a uma marca inteira.
  cta_texto: Quer saber em qual dessas etapas sua marca está travada?
  cta: Pedir meu Raio-X
  cta_destino: "#orcamento"

raio_x:
  etiqueta: Raio-X Olorin
  titulo: O primeiro passo é de graça.
  texto: Antes de qualquer proposta, a gente olha o que você já tem. Sem compromisso e com preço aberto no fim.
  passos:
    - titulo: Você conta sobre a marca
      texto: Preenche o formulário em 2 etapas, com o que você faz e quanto investe hoje. A gente responde em até 1 dia útil.
    - titulo: Conversa de 30 minutos
      texto: Por vídeo, com quem coordena. Olhamos anúncio, redes, site e material da marca com você.
    - titulo: PDF em até 48 horas
      texto: Uma página com os 3 pontos que mais travam a sua venda e as 3 ações para começar. Se fizer sentido, vem junto a proposta, com preço aberto.

orcamento:
  etiqueta: Raio-X Olorin gratuito
  titulo_1: Vamos olhar sua
  titulo_2: marca juntos.
  lista:
    - 30 minutos por vídeo com quem coordena
    - PDF em até 48 horas com 3 pontos e 3 ações
    - Proposta com preço aberto, sem compromisso
    - Resposta em até 1 dia útil
  janela: whatsapp.exe
  wa_etiqueta: Prefere resolver agora?
  wa_texto: Chama no WhatsApp

relatorio:
  etiqueta: Como é o nosso relatório
  titulo: Faturamento, não só alcance.
  texto: Todo mês você recebe um painel como este, com o que foi investido, o que voltou e o que muda na próxima rodada. Sem sigla solta e sem gráfico bonito que não diz nada.
  aviso: Exemplo ilustrativo, com dados fictícios
  janela: painel.exe
  mes: Mês de exemplo
  indicadores:
    - rotulo: Investimento em anúncio
      valor: R$ 3.000
      variacao: mesmo valor do mês anterior
      tendencia: neutra
    - rotulo: Faturamento atribuído
      valor: R$ 7.800
      variacao: +12% sobre o mês anterior
      tendencia: alta
    - rotulo: Custo por venda
      valor: R$ 75,00
      variacao: −8% sobre o mês anterior
      tendencia: alta
    - rotulo: Retorno sobre o investimento
      valor: 2,6x
      variacao: era 2,3x no mês anterior
      tendencia: alta
  grafico_titulo: Faturamento atribuído por semana
  grafico:
    - rotulo: Semana 1
      valor: 1500
    - rotulo: Semana 2
      valor: 1800
    - rotulo: Semana 3
      valor: 2100
    - rotulo: Semana 4
      valor: 2400
  proxima_titulo: O que faremos na próxima rodada
  proxima:
    - Aumentar a verba da campanha de remarketing, que teve o menor custo por venda.
    - Trocar os dois anúncios com pior taxa de clique por versões novas.
    - Revisar a página de destino, que perde gente no celular.
  glossario: "Retorno sobre o investimento (ROAS): quanto voltou em faturamento para cada R$ 1 investido em anúncio."

