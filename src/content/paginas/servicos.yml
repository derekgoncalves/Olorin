# Hub de serviços (/servicos/) — PROMPT seção 9.3.
seo:
  titulo: Serviços de marketing digital em Curitiba | Olorin
  descricao: Tráfego pago, redes sociais, identidade visual, material impresso, site e rastreamento feitos pelo mesmo time. Preços abertos.
etiqueta: Serviços
titulo: Serviços de marketing digital
texto: Anúncio, conteúdo, site e impresso feitos pelo mesmo time de 3 especialistas. Você pode contratar uma frente só — mas quando elas rodam juntas, uma empurra a outra.
escolher:
  titulo: Como escolher por onde começar
  situacoes:
    - situacao: Você já anuncia, mas não sabe quanto cada venda custou.
      servico: trafego-pago
      porque: Começamos pelas campanhas e pelo relatório, para o retorno aparecer.
    - situacao: Sua marca parece diferente em cada lugar — no feed, no cartão, no site.
      servico: identidade-visual
      porque: Primeiro a marca com cara de marca. Depois, tudo sai com a mesma cara.
    - situacao: O anúncio leva gente para um site lento ou confuso.
      servico: site-e-loja-virtual
      porque: Um site rápido e claro no celular faz o mesmo investimento render mais.
  nao_sei: Não sabe por onde começar? É para isso que serve o Raio-X gratuito.
combinacoes:
  titulo: Combinações mais comuns
  itens:
    - nome: Tráfego pago + redes sociais
      plano: Gestão mensal
      texto: Anúncio e conteúdo todo mês, com criação de peças inclusa e relatório fechado. A partir de R$ 2.500/mês + verba.
    - nome: A marca inteira
      plano: 360 completo
      texto: Estratégia, anúncio, redes, criação, material impresso e site sob o mesmo comando. A partir de R$ 5.000/mês + verba.
    - nome: Uma entrega fechada
      plano: Pontual
      texto: Identidade visual, site, impresso ou auditoria da conta de anúncio, com prazo e escopo definidos. A partir de R$ 800/projeto.
