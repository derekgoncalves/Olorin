# Hub de serviços (/servicos/). Preços no molde do dono (13/10/2026), iguais a src/content/planos.yml.
seo:
  titulo: Serviços de Marketing Digital em Curitiba | Olorin
  descricao: Tráfego pago, redes sociais, identidade visual, impressos, sites e dados coordenados pelo mesmo time. Preço aberto, a partir de R$ 800.
etiqueta: Serviços de marketing digital em Curitiba
titulo: Seis frentes, um time só.
texto: Anúncio, redes, marca, impresso, site e dados coordenados pelo mesmo time. Contrate uma frente só ou junte todas. Quando rodam juntas, uma empurra a outra.
janela: servicos.exe
cards:
  etiqueta: O que fazemos
  titulo: Escolha a frente.
  texto: Cada serviço tem página própria, com o que entra, como funciona, quem coordena e o preço.
escolher:
  etiqueta: Por onde começar
  titulo: Qual é o seu caso?
  situacoes:
    - situacao: Você já anuncia, mas não sabe quanto cada venda custou.
      servico: trafego-pago
      porque: Arrumamos as campanhas e o rastreamento. O relatório passa a mostrar quanto custou cada venda.
    - situacao: "Sua marca parece diferente em cada lugar: no feed, no cartão e no site."
      servico: identidade-visual
      porque: Primeiro, uma identidade clara. Depois, anúncio, post, site e impresso saem com a mesma cara.
    - situacao: O anúncio leva gente para um site lento ou confuso.
      servico: site-e-loja-virtual
      porque: Um site rápido e claro no celular aproveita melhor cada visita que o anúncio traz.
  nao_sei: Ainda em dúvida? O Raio-X gratuito mostra por onde começar, com 30 minutos por vídeo e um PDF em até 48 horas.
combinacoes:
  etiqueta: Combinações
  titulo: Junto rende mais.
  texto: Os formatos mais pedidos, com o preço aberto. A verba de anúncio vai direto para a Meta ou o Google.
  itens:
    - plano: Gestão mensal
      janela: gestao_mensal.exe
      nome: Tráfego pago + redes sociais
      de: ""
      valor: R$ 2.500/mês
      texto: Meta Ads ou Google Ads, 8 criativos e 8 posts por mês, otimização semanal e relatório com reunião. Implantação única de R$ 1.000.
      servicos: [trafego-pago, redes-sociais]
    - plano: Marketing 360
      janela: marketing_360.exe
      nome: A marca inteira
      de: A partir de
      valor: R$ 5.000/mês
      texto: Anúncio, redes, marca, site e impresso juntos, sem quantidade fechada, com reunião semanal e planejamento estratégico todo mês.
      servicos: [trafego-pago, redes-sociais, identidade-visual, material-impresso, site-e-loja-virtual, rastreamento-e-relatorio]
    - plano: Pontual
      janela: pontual.exe
      nome: Uma peça de design
      de: A partir de
      valor: R$ 800
      texto: Logotipo, identidade visual, post avulso ou impresso, com prazo e escopo fechados e sem contrato mensal.
      servicos: [identidade-visual, material-impresso]
    - plano: Sites
