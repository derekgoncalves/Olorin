# Hub de serviços (/servicos/). 17/10/2026 (dono): sem preços, planos, método e dúvidas; a chamada é o Raio-X gratuito.
seo:
  titulo: Serviços de Marketing Digital | Olorin Digital
  descricao: "Anúncios, redes, marca, site, impressos e dados coordenados pelo mesmo time. Peça o Raio-X gratuito e veja por onde começar."
etiqueta: Serviços de marketing digital
titulo: Entregas que trabalham juntas.
texto: Anúncios, redes, marca, site, impressos e dados coordenados pelo mesmo time. Contrate uma frente só ou junte todas. Quando rodam juntas, uma puxa a outra.
janela: servicos.olo
janela_linhas:
  - Um time · seis frentes
  - Raio-X · gratuito
cards:
  etiqueta: O que fazemos
  titulo: Escolha a frente.
  texto: Cada serviço tem página própria, com o que pode entrar, os trabalhos do time e quem coordena.
escolher:
  etiqueta: Por onde começar
  titulo: Este é o seu caso?
  situacoes:
    - situacao: Você já anuncia, mas não sabe quanto cada venda custou.
      servico: trafego-pago
      porque: Arrumamos as campanhas e o rastreamento. O relatório passa a mostrar quanto custou cada venda.
    - situacao: "Sua marca parece diferente em cada lugar: no feed, no cartão e no site."
      servico: identidade-visual
      porque: Primeiro, uma identidade clara. Depois, anúncio, post, site e impresso saem com a mesma cara.
    - situacao: O anúncio leva gente para um site lento ou confuso.
      servico: site-e-loja-virtual
      porque: Um site rápido e claro no celular aproveita melhor cada visita que o anúncio traz.
  nao_sei: Ainda em dúvida? O Raio-X gratuito mostra por onde começar.
# Combinações de serviços que mais recomendamos (sem plano nem preço). "servicos" pré-marca as frentes no formulário.
combinacoes:
  etiqueta: Combinações
  titulo: Junto rende mais.
  texto: As frentes que mais recomendamos juntas. No Raio-X, a gente mostra qual combinação faz sentido para você.
  itens:
    - janela: anuncio_e_feed.olo
      nome: Tráfego pago + redes sociais
      texto: O anúncio traz gente nova e o feed confirma o que ele promete. Mesmo time, mesma cara, ajuste toda semana e relatório todo mês.
      servicos: [trafego-pago, redes-sociais]
    - janela: marca_inteira.olo
      nome: A marca inteira
      texto: Anúncios, redes, marca, site, impressos e dados juntos, com reunião semanal e planejamento todo mês.
      servicos: [trafego-pago, redes-sociais, identidade-visual, material-impresso, site-e-loja-virtual, rastreamento-e-relatorio]
    - janela: marca_e_papel.olo
      nome: Identidade + impressos
      texto: Uma identidade clara e cada peça impressa com a mesma cara, do cartão à fachada, com o arquivo certo para a gráfica.
      servicos: [identidade-visual, material-impresso]
    - janela: site_e_dados.olo
      nome: Site + dados
      texto: Um site rápido no celular, com a medição configurada desde o primeiro dia, para saber de onde veio cada contato e cada venda.
      servicos: [site-e-loja-virtual, rastreamento-e-relatorio]
  botao: Quero essa combinação
