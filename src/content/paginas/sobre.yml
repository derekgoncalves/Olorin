# Página /sobre/ — só fatos (PROMPT seções 2 e 12.3).
seo:
  titulo: Sobre a Olorin Digital | Agência de marketing em Curitiba
  descricao: Conheça o time de 3 especialistas da Olorin, o Método Olorin e como atendemos marcas de todo o Brasil, 100% a distância, a partir de Curitiba.
etiqueta: Sobre a Olorin
titulo: Um time de 3 especialistas cuidando da sua marca inteira.
sub: A Olorin Digital é uma agência de marketing digital de Curitiba, especialista em captação de alunos para escolas e cursos. Atendemos marcas de todo o Brasil, 100% a distância.
historia:
  titulo: Por que a Olorin existe
  paragrafos:
    - "A Olorin nasceu para juntar o que quase sempre vive separado: estratégia, anúncio, conteúdo, arte, site e impresso."
    - Quando cada parte fica com um fornecedor diferente, a marca fala várias línguas e ninguém sabe dizer quanto cada real trouxe de volta.
    - Aqui, tudo sai do mesmo time. O preço é aberto, o relatório é fácil de entender e não prometemos o que o número não sustenta.
    - Somando tudo, o time já atendeu mais de 50 marcas e geriu mais de R$ 2 milhões em verba de anúncio.
  lema: Não é sobre aparecer. É sobre vender.
equipe:
  titulo: Quem toca a Olorin
metodo:
  titulo: Como trabalhamos
  texto: Todo projeto passa pelas mesmas quatro etapas, do Raio-X ao relatório.
remoto:
  titulo: 100% remoto, de Curitiba para todo o Brasil
  itens:
    - A maioria dos clientes é de fora de Curitiba. O processo foi feito para funcionar a distância.
    - Conversa pelo WhatsApp, reuniões por vídeo, aprovações por e-mail e arquivos entregues pela internet.
    - O Derek é o seu primeiro contato e coordena a sua conta no dia a dia.
    - "[CONFIRMAR: Natália e Vinicius participam do início de cada projeto e da reunião mensal]"
contato:
  titulo: Quer conversar com a gente?
  botao: Falar com a equipe no WhatsApp
