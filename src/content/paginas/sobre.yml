seo:
  titulo: Sobre a Olorin Digital | Agência de marketing em Curitiba
  descricao: Conheça o time de 3 especialistas da Olorin, o Método Olorin e como trabalhamos 100% remoto para marcas de todo o Brasil.
etiqueta: Sobre a Olorin
titulo: Um time de 3 especialistas cuidando da sua marca inteira.
sub: A Olorin Digital é uma agência de marketing digital de Curitiba, especialista em captação de alunos para escolas e cursos, com atendimento 100% remoto para marcas de todo o Brasil.
historia:
  titulo: Por que a Olorin existe
  paragrafos:
    - A Olorin nasceu para juntar o que quase sempre vive separado — a estratégia, o anúncio, o conteúdo, a arte e o impresso.
    - "Quando cada parte é feita por um fornecedor diferente, a marca fala várias línguas e ninguém sabe dizer quanto cada real devolveu. Aqui, anúncio, conteúdo, site e impresso saem do mesmo time: preço aberto, relatório que qualquer pessoa entende e nenhuma promessa que o número não sustenta."
  lema: Não é sobre aparecer. É sobre vender.
equipe:
  titulo: Quem toca a Olorin
metodo:
  titulo: Como trabalhamos
  texto: Todo projeto passa pelas quatro etapas do Método Olorin.
remoto:
  titulo: 100% remoto, sem distância
  itens:
    - A maioria dos clientes é de outras cidades. O processo foi feito para funcionar a distância.
    - Reuniões por vídeo, aprovações por e-mail e entregáveis digitais.
    - O Derek é o seu primeiro contato e coordena a sua conta no dia a dia.
    - "[CONFIRMAR: Natália e Vinicius participam do início de cada projeto e da reunião mensal]"
