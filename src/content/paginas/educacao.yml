# Perguntas desta página (também vão para o JSON-LD da página).
faq:
  - id: faq-edu-quem
    pergunta: Que tipo de escola ou curso vocês atendem?
    resposta: Quem precisa encher turma e vende matrícula. Cursos livres e profissionalizantes, escolas de idiomas, pré-vestibular, pós-graduação e escolas particulares que querem uma comunicação mais moderna.
  - id: faq-edu-quando
    pergunta: Quando devo começar a captação para o ano que vem?
    resposta: O quanto antes. Para escolas, a captação de matrículas costuma ir de outubro a fevereiro. Começar cedo dá tempo para testar anúncios e baixar o custo por matrícula antes do pico.
  - id: faq-raio-x-edu
    pergunta: O que é o Raio-X gratuito?
    resposta: É uma conversa de 30 minutos por vídeo sobre a sua captação. Em até 48 horas você recebe um PDF de 1 página com os 3 pontos que mais travam a sua matrícula e as 3 ações para começar. Olhamos anúncio, Instagram, site, Perfil da Empresa no Google e o atendimento pelo WhatsApp. Não tem compromisso.
  - id: faq-edu-medir
    pergunta: Como vocês medem matrícula, se ela acontece na secretaria?
    resposta: Combinamos com a sua equipe uma forma simples de registrar de onde veio cada aluno, como uma etiqueta no WhatsApp ou uma pergunta na ficha de matrícula. Assim o relatório mostra contatos, visitas e matrículas por canal.
  - id: faq-arranque-edu
    pergunta: Dá pra testar antes de assinar a gestão mensal?
    resposta: Sim, com o Arranque 30 dias, a partir de R$ 1.800 uma única vez. Instalamos o rastreamento, colocamos 1 campanha no ar com 8 criativos e entregamos o relatório no dia 30. Se você seguir para a gestão mensal, o valor do Arranque é abatido da implantação.
  - id: faq-verba-edu
    pergunta: Qual a verba mínima para anunciar?
    resposta: Recomendamos pelo menos R$ 1.500 por mês, investidos direto na Meta e no Google, na sua conta. Na temporada de matrículas vale concentrar mais verba. Somando a Gestão mensal (R$ 2.500), o custo total de entrada fica a partir de R$ 4.000 por mês.
  - id: faq-edu-fidelidade
    pergunta: Preciso ficar o ano inteiro?
    resposta: Não. Na gestão mensal, o contrato mínimo é de 3 meses. Depois, fica mês a mês com aviso de 30 dias, sem multa rescisória.
  - id: faq-edu-fora
    pergunta: Vocês atendem escolas fora de Curitiba?
    resposta: Sim. O atendimento é 100% remoto, com reuniões por vídeo e relatório online.

