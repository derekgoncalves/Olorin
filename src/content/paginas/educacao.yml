# ============================================================
# /educacao/ — LP "Olorin Educação" (rodada de 17/10/2026)
# ------------------------------------------------------------
# Página própria para escolas e cursos, com visual próprio
# (src/styles/componentes/educacao.css, tudo dentro de .o-tema-educacao).
# A marcação e a ordem das seções ficam em src/educacao/index.njk.
# Sem preços e sem planos: toda chamada leva ao formulário do Raio-X, no fim da página (#raio-x).
# A equipe vem de equipe.yml, os cases de cases.yml, as logos de clientes.yml e o formulário
# é o mesmo do site (formulario.yml).
# "# PENDENTE:" marca o que o dono ainda precisa confirmar (npm run pendencias).
# ============================================================

seo:
  titulo: Marketing para instituições de ensino | Olorin Educação
  descricao: "Captação de alunos para universidades, escolas, cursos, idiomas, pré-vestibular e pós. Anúncio, Instagram e atendimento. Peça o Raio-X grátis."

marca:
  nome: Olorin Educação
  sub: educação
  lema: Sua escola em outro nível.
  apoio: Do curso livre à pós-graduação.
  parte_de: A Olorin Educação é a área de instituições de ensino da Olorin Digital.

# Mensagens prontas dos links de WhatsApp desta página.
whatsapp:
  padrao: Oi! Vim pela página Olorin Educação e quero o Raio-X da minha instituição.
  equipe: Oi! Vim pela página Olorin Educação e quero falar com a equipe.
  # Assunto do link "Chame no WhatsApp" embaixo do formulário ("...quero falar sobre ...").
  assunto_form: o Raio-X da minha instituição

# Formulário: o mesmo do site (formulario.yml). Só nesta página, estes textos valem por cima dos
# de formulario.yml (ver src/educacao/index.11tydata.js). Use só textos aqui, sem listas.
formulario:
  barra_topo: ficha_raio_x.olo
  barra_fim: ficha_raio_x.olo
  placeholders:
    site: "@suainstituicao ou seusite.com.br"
    mensagem: "Ex.: somos uma faculdade e queremos mais matrículas para o próximo semestre."

cabecalho:
  menu:
    - { rotulo: Para quem, url: "#para-quem" }
    - { rotulo: Calendário, url: "#calendario" }
    - { rotulo: Cases, url: "#cases" }
    - { rotulo: Equipe, url: "#equipe" }
  menu_extra: []
  voltar: Site da Olorin
  voltar_longo: Voltar para o site da Olorin Digital
  botao: Raio-X grátis
  whatsapp: Falar no WhatsApp
  remoto: Atendimento 100% remoto

hero:
  etiqueta: Olorin Educação · captação de alunos
  # O h1 é o lema da LP (marca.lema): "titulo" + "titulo_destaque" (com o risco de giz).
  titulo: Sua escola em
  titulo_destaque: outro nível.
  # Linha de apoio: "apoio" sai em negrito, na frente do "texto".
  apoio: Turma cheia não é sorte.
  texto: Anúncio, Instagram e atendimento com a mesma equipe, e um boletim todo mês com o custo de cada matrícula.
  botao: Quero o Raio-X grátis
  # Os 3 itens com check ao lado do botão (os mesmos de todas as páginas do site).
  prova:
    - Raio-X gratuito e sem compromisso
    - Estratégia e performance
    - Produção de alto nível
  # Exemplo ilustrativo (não é cliente): mostra o Raio-X como um boletim, com nota por canal.
  boletim:
    janela: boletim.olo
    titulo: Boletim da captação
    escola: Instituição Exemplo
    periodo: Raio-X gratuito
    coluna_materia: Matéria
    coluna_nota: Nota
    materias:
      - nome: Anúncio na Meta e no Google
        nota: "8,5"
      - nome: Instagram da instituição
        nota: "7,0"
      - nome: Site e página de matrícula
        nota: "6,0"
      - nome: Resposta no WhatsApp
        nota: "4,5"
        obs: recuperação · 3 h 40 min para responder
        alerta: true
      - nome: Custo por matrícula
        nota: "?"
        obs: ninguém mede
        alerta: true
    carimbo: Raio-X
    aviso: Exemplo ilustrativo de Raio-X, com dados fictícios.

# Faixa em forma de régua, logo abaixo do banner.
regua:
  - Captação de alunos
  - Campanha de matrícula
  - Meta Ads e Google Ads
  - Instagram da instituição
  - Página de matrícula
  - Atendimento no WhatsApp
  - Custo por matrícula

chamada:
  etiqueta: Para quem é
  titulo: Feita para quem vende matrícula.
  texto: Universidade, escola, curso ou pós-graduação. Se a receita depende de turma cheia, a Olorin Educação toca a sua captação.
  nota: Atendimento 100% remoto, com reunião por vídeo e boletim online.
  janela: chamada.olo
  turma: Lista de chamada
  presente: presente
  itens:
    - Universidades e faculdades
    - Escolas particulares
    - Cursos livres
    - Cursos profissionalizantes
    - Escolas de idiomas
    - Pré-vestibular e preparatórios
    - Pós-graduação
    - Educação executiva
  ausente: ausente
  ausente_texto: Quem só quer post bonito, sem medir matrícula.

calendario:
  etiqueta: Calendário de captação
  # PENDENTE: revisar título e texto a cada temporada (de março a agosto, algo como "Comece cedo.")
  titulo: Ainda dá tempo.
  texto: Em escola, a família costuma decidir entre outubro e janeiro, com pico em novembro. Começando agora, a campanha chega pronta ao pico.
  aqui: Você está aqui
  pico: pico
  vagas: 10
  turma_legenda: A turma enchendo ao longo da temporada (ilustração).
  fora: Fora da temporada? Melhor. Dá para preparar a próxima com calma.
  nota: Curso livre, idiomas, pré-vestibular e pós têm calendário próprio, às vezes com mais de uma entrada por ano. No Raio-X, montamos o do seu curso.
  botao: Quero o Raio-X grátis
  meses:
    - mes: 10
      nome: Outubro
      curto: out
      fase: Preparar
      texto: Raio-X, planejamento, criativos e campanha no ar.
      turma: 2
    - mes: 11
      nome: Novembro
      curto: nov
      fase: Pico
      texto: As famílias decidem. Visitas e aulas experimentais.
      turma: 5
      pico: true
    - mes: 12
      nome: Dezembro
      curto: dez
      fase: Fechar
      texto: Matrícula, rematrícula e retorno para quem visitou.
      turma: 8
    - mes: 1
      nome: Janeiro
      curto: jan
      fase: Ajustar
      texto: Quem decide tarde. Verba onde o custo por matrícula é menor.
      turma: 9
    - mes: 2
      nome: Fevereiro
      curto: fev
      fase: Ler
      texto: Volta às aulas. Boletim da temporada e lições para a próxima.
      turma: 10

cases:
  etiqueta: Clientes
  titulo: Quem já atendemos.
  texto: Uma edtech de educação em saúde e a venda de cursos e obras de um especialista em Direito Público.
  ficha: Ficha nº
  carimbo: Atendido pela Olorin
  site: Ver o site

equipe:
  etiqueta: Quem coordena
  titulo: Fale com quem coordena.
  texto: Agência parceira Meta e Google. Um time inteiro na sua captação, com uma pessoa respondendo por cada frente.
  frases:
    natalia-arruda: Gestora de tráfego com mais de seis anos em mídia paga e contas de educação no currículo. Dirige a estratégia e os anúncios.
    vinicius-mafra: Mais de 10 anos de direção de arte. Dá cara de marca a quem costuma ter comunicação burocrática.
    derek-goncalves: Seu primeiro contato e quem coordena a sua captação no dia a dia.
  botao: Falar com a equipe no WhatsApp
  link_sobre: Conheça quem somos

# Seção final, igual à do site: o título, os passos com o "O" da Olorin, a chapa do Raio-X
# (partials/chapa-raio-x.njk, variante "educacao") e o formulário (#raio-x).
raio_x:
  titulo: Raio X da Olorin
  passos:
    - Você conta sobre a instituição
    - A gente testa o atendimento e analisa tudo
    - Você recebe o plano da captação

rodape:
  nesta_pagina: Nesta página
  olorin: Olorin Digital
  contato: Contato
  links_olorin:
    - { rotulo: Site da Olorin, url: / }
    - { rotulo: Portfólio, url: /portfolio/ }
    - { rotulo: Sobre, url: /sobre/ }
    - { rotulo: Quem somos, url: /quem-somos/ }
