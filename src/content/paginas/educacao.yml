raio_x:
  etiqueta: Raio-X gratuito
  titulo: Seu atendimento, cronometrado.
  texto: Mandamos mensagem como um interessado e medimos quanto a resposta demora. Depois olhamos anúncio, Instagram e site e mostramos onde a matrícula escapa.
  passos:
    - Você preenche a ficha. Leva 1 minuto.
    - Testamos o seu atendimento, como um interessado.
    - Conversamos 30 minutos por vídeo.
    - Em até 48 horas, você recebe um PDF de 1 página.
  itens:
    - Grátis e sem compromisso
    - Tempo de resposta medido no PDF
    - Proposta com preço aberto
  dado:
    antes: Quem responde em até 1 hora tem quase
    numero: 7 vezes
    depois: mais chance de uma conversa de verdade do que quem demora só mais 1 hora.
    fonte: Harvard Business Review, 2011
    fonte_url: https://hbr.org/2011/03/the-short-life-of-online-sales-leads

