checklist:
  etiqueta: Checklist da captação
  titulo: Se a turma não fecha, o problema raramente é o curso.
  dica: Marque o que acontece na sua escola.
  itens:
    - O Instagram tem curtida, mas o WhatsApp não recebe pedido de matrícula.
    - Você anuncia todo ano na mesma época e não sabe quanto custou cada aluno novo.
    - O interessado manda mensagem e demora horas para ter resposta.
    - O site não diz preço, turma, horário nem como se matricular.
    - Cada campanha parece de uma escola diferente.
    - A captação para o ano que vem começa sempre em cima da hora.
  contador_um: marcado
  contador_varios: marcados
  resposta_titulo: Captação é processo, não sorte de temporada.
  resposta: Quando anúncio, conteúdo e atendimento puxam juntos, o interessado vira visita, a visita vira matrícula e você sabe quanto custou cada etapa. É isso que a gente monta e acompanha com você.
  resposta_padrao: Se você marcou dois ou mais, a gente começa pelo Raio-X.
  cta: Ver como a gente resolve

