# ============================================================
# /educacao/ — LP "Olorin Educação" (versão final, 14/10/2026)
# ------------------------------------------------------------
# Página própria para escolas e cursos, com visual próprio
# (src/styles/componentes/educacao.css, tudo dentro de .o-tema-educacao).
# A marcação e a ordem das seções ficam em src/educacao/index.njk.
# Preços e equipe vêm dos mesmos arquivos do site (planos.yml e equipe.yml),
# os cases vêm de cases.yml e o formulário é o mesmo do site (formulario.yml).
# "# PENDENTE:" marca o que o dono ainda precisa confirmar (npm run pendencias).
# ============================================================

seo:
  titulo: Marketing para instituições de ensino | Olorin Educação
  descricao: "Captação de alunos para universidades, escolas, cursos, idiomas, pré-vestibular e pós. Anúncio, Instagram e atendimento, com o custo por matrícula."

