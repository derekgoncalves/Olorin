# Perguntas desta página (também vão para o JSON-LD da página).
faq:
  - id: faq-edu-quem
    pergunta: Que tipo de instituição vocês atendem?
    resposta: Quem vende matrícula. Universidades e faculdades, escolas particulares, cursos livres e profissionalizantes, escolas de idiomas, pré-vestibular, pós-graduação e educação executiva. Do curso de uma sala só à rede com várias unidades.
  - id: faq-edu-pequena
    pergunta: Funciona para instituição ou curso pequeno?
    resposta: Sim. Para começar, um serviço avulso (a partir de R$ 1.500 por mês) ou a Gestão mensal (R$ 3.000 por mês) costuma bastar. No Raio-X, dizemos qual faz sentido para você.
  - id: faq-edu-quando
    pergunta: Quando devo começar a captação para o ano que vem?
    resposta: O quanto antes. Em escola, a família costuma decidir entre outubro e janeiro, com pico em novembro. Começar cedo dá tempo de testar anúncio e baixar o custo por matrícula antes do pico. Em outubro, ainda dá tempo.
  - id: faq-raio-x-edu
    pergunta: O que é o Raio-X gratuito?
    resposta: Um teste de atendimento e uma análise da sua captação. Mandamos mensagem como um interessado e medimos o tempo de resposta. Depois olhamos anúncio, Instagram, site e Perfil da Empresa no Google. Numa conversa de 30 minutos por vídeo, mostramos o que vimos. Em até 48 horas, você recebe um PDF de 1 página com o que mais trava a matrícula e por onde começar. Sem compromisso.
  - id: faq-edu-medir
    pergunta: Como vocês medem matrícula, se ela fecha na secretaria?
    resposta: Combinamos com a sua equipe um jeito simples de registrar de onde veio cada aluno. Pode ser uma etiqueta no WhatsApp ou uma pergunta na ficha de matrícula. Assim o boletim do mês mostra contatos, visitas e matrículas por canal, e quanto custou cada uma.
  - id: faq-edu-atendimento
    pergunta: Preciso de alguém para atender os interessados?
    resposta: Sim, a matrícula fecha com a sua equipe. Nós trazemos o interessado, organizamos as mensagens da sua instituição prontas para cada etapa e medimos o tempo de resposta. Se travar no atendimento, o boletim mostra.
  - id: faq-edu-prazo
    pergunta: Em quanto tempo aparece matrícula?
    resposta: Os primeiros contatos costumam chegar nos primeiros dias de campanha. A matrícula depende do ciclo do seu curso. Em curso livre, pode sair na mesma semana; em escola, a família visita e compara antes. Por isso começamos cedo e medimos cada etapa.
  - id: faq-verba-edu
    pergunta: Qual a verba mínima para anunciar?
    resposta: Recomendamos a partir de R$ 1.500 por mês, investidos direto na Meta e no Google, na sua conta. Na temporada de matrícula, vale concentrar mais. Com a Gestão mensal (R$ 3.000), o custo total começa em R$ 4.500 por mês.
  - id: faq-edu-fidelidade
    pergunta: Preciso ficar o ano inteiro?
    resposta: Não. No serviço avulso, na Gestão mensal e no Marketing 360, o contrato mínimo é de 3 meses. Depois, fica mês a mês, com aviso de 30 dias e sem multa.
  - id: faq-edu-fora
    pergunta: Vocês atendem fora de Curitiba?
    resposta: Sim. O atendimento é 100% remoto, com reunião por vídeo e relatório online.

