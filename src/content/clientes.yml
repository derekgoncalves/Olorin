# ============================================================
# BARRA DE LOGOS DE CLIENTES (site todo: secoes/faixa-clientes.njk)
# ------------------------------------------------------------
# Marcas atendidas pela Olorin e pelo time (tráfego da Nat, design do Vini).
# Os arquivos ficam em src/assets/clientes/ (no servidor: /assets/img/clientes/).
# Logos em uma cor só (preto, fundo transparente), em SVG. Onde o logo tem duas camadas que se
# sobrepõem (etiqueta e carrinho da Centro Sul Shop), a de trás fica em preto a 40%.
# Versões coloridas (cards do portfólio e Olorin Educação): <nome>-cor.svg.
#
# TROCAR UM LOGO SÓ PELO FTP (sem novo build): suba o arquivo novo para
# /assets/img/clientes/ com o MESMO nome e a MESMA extensão (ex.: bravo.svg), em
# preto com fundo transparente e sem margem em volta. O site mantém a altura
# definida abaixo e a largura acompanha a proporção do arquivo novo.
# Nome ou extensão diferente (ex.: .png) precisa de um novo build.
#
# Campos: nome = texto alternativo (o nome do cliente); logo = arquivo;
# altura = altura do logo em px no computador (no celular encolhe sozinha), ajustada
# a olho para todos terem o mesmo peso visual; largura = altura x proporção do
# arquivo (só reserva o espaço enquanto a imagem carrega). cor: true = logo colorido original (não vira
# branco no fundo escuro); logo_escuro = versão do original para fundo escuro (o texto escuro vira branco).
# 19/10/2026 (dono): iZETA e Anacleto com os logos originais enviados por ele, em cor.
# 17/10/2026: iZETA e Anacleto refeitos dos PNGs transparentes do dono; National Geographic e
# Centro Sul Shop (logo enviado pelo dono, no lugar do letreiro provisório da Central Sul Móveis) novos.
# ============================================================
