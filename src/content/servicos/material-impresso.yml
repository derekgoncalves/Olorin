    - titulo: Banner, fachada e adesivo
      texto: Comunicação de ponto de venda e de evento, do banner ao letreiro.
      frequencia: por peça
      icone: pixel
    - titulo: Embalagem e rótulo
      texto: Caixa, sacola, tag e rótulo com a cara da marca.
      frequencia: por projeto
      icone: check
    - titulo: Arquivo para a gráfica
      texto: "Sangria, perfil de cor e resolução certos, no formato que a gráfica pede."
      frequencia: em toda peça
      icone: site
    - titulo: Prova acompanhada
      texto: Conferimos a prova com a gráfica antes de rodar a tiragem.
      frequencia: em toda peça
      icone: relogio

portfolio:
  titulo: Feito para pegar.
  texto: Cartazes, sinalização e peças de evento feitos pelo nosso time.

como_funciona:
  titulo: Da tela ao papel.
  etapas:
    - { nome: Raio-X, texto: "Entendemos onde a peça vai ser usada, por quem e com qual objetivo." }
    - { nome: Direção, texto: "Formato, papel e acabamento definidos com você e com a gráfica." }
    - { nome: Execução, texto: "Arte criada, com rodadas de ajuste toda semana, e arquivo fechado para impressão." }
    - { nome: Leitura, texto: "Prova conferida e material entregue do jeito combinado." }
  prazos_titulo: Prazo de cada peça
  prazos:
    - "Primeira versão em cerca de 7 dias úteis, em média."
    - "Rodadas de ajuste toda semana, até a aprovação e o arquivo fechado."
    - "A impressão segue o prazo da gráfica. O prazo exato sai na proposta."

precisamos:
  titulo: Para começar, precisamos de
  itens:
    - A identidade visual da marca (logo, cores e fontes).
    - Os textos, fotos e informações que vão na peça.
    - O formato e a gráfica, se você já tiver uma preferida.

para_quem:
  e:
    - Quem tem ponto físico, estande ou evento e quer material à altura da marca.
    - Quem vende na mão e precisa de catálogo, folder ou cardápio.
    - Quem quer impresso e digital com a mesma cara.
  nao_e:
    - Quem precisa só imprimir um arquivo pronto (aí é direto com a gráfica).
    - Quem procura impressão em grande tiragem sem arte nova.

preco:
  titulo: Preço aberto.
  formato: Design de impressos
  rotulo: A partir de
  valor: R$ 800
  detalhe: "Entrega pontual, com escopo e prazo fechados na proposta. O valor final depende das peças e do tamanho de cada uma. A impressão é paga direto à gráfica, e a Olorin pode indicar e acompanhar."
  contrato: Sem contrato mensal. Metade na aprovação da proposta e metade na entrega.
  inclui:
    - Criação da arte com a cara da marca
    - Arquivo fechado para a gráfica
