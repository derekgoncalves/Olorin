resposta_curta: >-
  Design de material impresso é criar cartão, folder, catálogo, banner, fachada e embalagem com a cara da
  sua marca e entregar o arquivo fechado para a gráfica. Na Olorin, o projeto sai a partir de R$ 800, e o
  valor final depende das peças, combinado na proposta. A impressão é paga direto à gráfica.

o_que_e:
  titulo: Do arquivo à gráfica.
  texto:
    - "Material impresso é o que o seu cliente leva para casa: o cartão, o folder, o cardápio, a sacola, a fachada que ele vê da rua. É a marca que dá para pegar na mão."
    - A Olorin cria a peça com a mesma cara do seu anúncio e do seu feed, fecha o arquivo do jeito que a gráfica pede, com sangria, cor e resolução certas, e acompanha a prova para nada sair diferente do combinado.
    - Você não precisa entender de gráfica. A gente conversa com ela por você.
  destaques:
    - Arquivo fechado sem retrabalho
    - Prova conferida antes de imprimir
    - A mesma cara do digital

dores:
  titulo: Surpresa na gráfica?
  texto: Se um destes aparece aí, o seu impresso está custando mais do que devia.
  itens:
    - { titulo: Arquivo recusado, texto: "A gráfica devolve o arquivo por falta de sangria, resolução ou cor certa." }
    - { titulo: Cor que muda, texto: "O roxo da tela vira outro roxo no papel." }
    - { titulo: Cada peça de um jeito, texto: "Cartão, folder e banner parecem de empresas diferentes." }
    - { titulo: Tudo em cima da hora, texto: "O evento é amanhã e o material ainda nem foi para a gráfica." }

entregas:
  titulo: O que pode entrar.
  texto: Peças com a cara da marca e o arquivo certo para cada gráfica.
  itens:
