janela: grafica.pdf
atualizado: "2026-10-13"
quem_faz: [vinicius-mafra]
quem_faz_nota: "[CONFIRMAR: Vinicius Mafra como responsável pelo material impresso e se o Derek entra como atendimento]"

seo:
  title: Material Impresso para Empresas em Curitiba | Olorin
  description: Cartão, folder, catálogo, banner, adesivo, fachada e embalagem. Arquivo fechado pronto para a gráfica e acompanhamento da prova.

card:
  titulo: Material impresso
  resumo: Cartão, folder, catálogo, banner, adesivo, fachada e embalagem. Do arquivo fechado ao acompanhamento da prova na gráfica.
  resumo_curto: Do cartão à fachada, pronto para a gráfica.

hero:
  eyebrow: Material impresso para empresas em Curitiba e para todo o Brasil
  h1: Impresso que conversa com o seu digital.
  sub: Cartão, folder, catálogo, banner, adesivo, fachada e embalagem com a mesma cara do seu anúncio, do feed e do site. Entregamos o arquivo pronto para a gráfica.
  janela_linhas:
    - Cartão de visita · arquivo fechado
    - Folder · pronto para a gráfica
    - Prova · em aprovação

resposta_curta: >-
  Criamos cartão, folder, catálogo, banner, adesivo, fachada e embalagem com a mesma cara do seu digital.
  Entregamos o arquivo fechado, pronto para a gráfica, mas não imprimimos. Se precisar, indicamos gráficas
  parceiras em Curitiba e acompanhamos a prova, a amostra conferida antes de imprimir. Os projetos custam a
  partir de R$ 800, com escopo e prazo definidos antes de começar.

dores:
  titulo: Isso acontece com você?
  itens:
    - O impresso parou no tempo enquanto o digital foi atualizado.
    - Cartão, folder e fachada parecem de outra empresa, não da que aparece no anúncio.
    - A gráfica pede o “arquivo fechado”, e ninguém sabe o que mandar.
    - O erro só aparece depois de tudo impresso, quando já não dá para corrigir.

para_quem:
  e:
    - Quem quer peças impressas com a mesma cara do anúncio, do feed e do site.
    - Quem já tem uma gráfica de confiança e só precisa do arquivo certo.
    - Quem prefere uma entrega fechada, com escopo e prazo definidos antes.
  nao_e:
    - Quem procura alguém para imprimir. A impressão fica com a gráfica.
    - Quem precisa de um projeto por menos de R$ 800.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Cartão, folder e catálogo
      texto: As peças que vão para a mão do cliente, com as cores e as fontes da sua marca.
      icone: impresso
    - titulo: Banner, adesivo e fachada
      texto: A sua marca no ponto de venda, em eventos e na rua. Criamos a arte; a produção fica com a gráfica.
      icone: marca
    - titulo: Embalagem
      texto: A arte da embalagem com a mesma cara do resto da marca.
      icone: estrela
    - titulo: Arquivo fechado, pronto para a gráfica
      texto: O arquivo final, preparado para imprimir. Você só precisa mandar para a gráfica.
      icone: pixel
    - titulo: Indicação de gráficas parceiras
      texto: Se você ainda não tem uma gráfica de confiança, indicamos parceiras em Curitiba.
      icone: seta
    - titulo: Acompanhamento da prova
      texto: A prova é a amostra que a gráfica faz antes de imprimir tudo. Conferimos com você, para o ajuste vir antes, e não depois.
      icone: check

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Raio-X
      texto: Olhamos o material que a marca já tem para ver o que está desatualizado e o que vale manter.
    - nome: Direção
      texto: No briefing, combinamos as peças, o escopo e o prazo.
    - nome: Execução
      texto: Criamos as peças. Você aprova por e-mail e recebe o arquivo fechado.
    - nome: Leitura
      texto: Na prova, a última conferência antes de imprimir, acompanhamos a aprovação com você.
  prazos:
    - "[CONFIRMAR: prazo típico de criação por tipo de peça (cartão, folder, catálogo, banner, fachada, embalagem)]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Um tempo para o briefing, em que definimos juntos as peças, o escopo e o prazo.
    - "O que a marca já tem: logotipo, cores, fontes, fotos e o impresso atual."
    - "[CONFIRMAR: quem escreve os textos das peças e quais informações pedimos no início (contatos, produtos, preços)]"
    - "[CONFIRMAR: especificações pedidas à gráfica (tamanho, papel, acabamento) e quem faz esse contato]"
    - Retorno nas aprovações por e-mail e a sua aprovação da prova antes de imprimir.

preco:
  titulo: Quanto custa
  formato: Projeto pontual
  valor: A partir de R$ 800/projeto
  faixa: "[CONFIRMAR: faixa de preço por escopo (quais peças e quantas)]"
  detalhe: O valor é da criação; a impressão é paga à gráfica. Escopo e prazo são definidos no briefing, e o preço vem detalhado na proposta, antes de começar.
  contrato: Projeto fechado, sem mensalidade.
  inclui:
    - Criação das peças combinadas no briefing
    - Arquivo fechado, pronto para a gráfica
    - Indicação de gráficas parceiras, se você precisar
    - Acompanhamento da prova
    - "[CONFIRMAR: rodadas de ajuste incluídas e formatos dos arquivos entregues]"
  nao_inclui:
    - A impressão e o custo da gráfica
    - Logotipo e manual de marca (no projeto de [identidade visual](/servicos/identidade-visual/))
  schema:
    valor: "800"
    minimo: true
    descricao: Projeto pontual de material impresso (arquivo fechado), a partir de R$ 800.

combina_com:
  - slug: identidade-visual
    porque: O impresso fica mais fácil com logotipo, cores e manual definidos. Se a marca ainda não tem, comece por aqui.
  - slug: redes-sociais
    porque: Quem conhece a marca pelo feed precisa reconhecê-la no folder e na fachada.

faq:
  - id: impresso-imprime
    pergunta: Vocês fazem a impressão ou só entregam o arquivo?
    resposta: Entregamos o arquivo fechado, pronto para a gráfica. Não imprimimos. Se precisar, indicamos gráficas parceiras em Curitiba e acompanhamos a prova.
  - id: impresso-quanto-custa
    pergunta: Quanto custa um projeto de material impresso?
    resposta: A partir de R$ 800. O preço vem detalhado na proposta, com escopo e prazo, antes de começar. A impressão é paga à parte, à gráfica.
  - id: impresso-prazo
    pergunta: Quanto tempo leva para o material ficar pronto?
    resposta: Depende das peças. O prazo de criação é definido no briefing, antes de começarmos. O tempo de impressão depende da gráfica.
  - id: impresso-prova
    pergunta: O que é a prova e por que acompanhar a aprovação?
    resposta: É a amostra que a gráfica faz antes de imprimir o pedido inteiro, a hora de conferir cor e texto. Acompanhamos com você, para o ajuste vir antes da impressão.
  - id: impresso-so-impresso
    pergunta: Dá para contratar só o material impresso?
    resposta: Sim, como projeto pontual. Se quiser impresso todo mês, junto com anúncio, redes e site, ele faz parte do [360 completo](/planos/).
  - id: impresso-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A maioria dos clientes é de fora de Curitiba. Tudo é feito a distância: WhatsApp, reuniões por vídeo, aprovações por e-mail e arquivos entregues pela internet. As gráficas que indicamos ficam em Curitiba."

