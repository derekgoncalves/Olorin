    - Fotos e ilustrações sob encomenda
  schema:
    valor: "800"
    minimo: true
    descricao: Design de material impresso a partir de R$ 800, com arquivo fechado para a gráfica. O valor final depende das peças; a impressão é paga à parte.

combina_com:
  - slug: identidade-visual
    porque: Com a identidade definida, cada impresso sai mais rápido e igual aos outros.
  - slug: site-e-loja-virtual
    porque: O impresso leva ao site pelo QR code. Os dois com a mesma cara fecham a venda.

faq:
  - id: impresso-grafica
    pergunta: Vocês imprimem também?
    resposta: A Olorin cria a arte, fecha o arquivo e acompanha a prova. A impressão é feita por uma gráfica parceira ou pela sua, e é paga direto a ela.
  - id: impresso-prazo
    pergunta: Quanto tempo leva?
    resposta: A primeira versão sai em cerca de 7 dias úteis, em média, com rodadas de ajuste toda semana até a aprovação. O prazo exato sai na proposta, e o da impressão depende da gráfica.
  - id: impresso-arquivo
    pergunta: Os arquivos ficam comigo?
    resposta: "Sim. Você recebe o arquivo aberto e o arquivo fechado para a gráfica, e pode reimprimir quando quiser."
  - id: impresso-urgente
    pergunta: Vocês fazem com urgência?
    resposta: Quando o prazo cabe na agenda, sim. Conte a data no Raio-X ou no WhatsApp que a gente diz na hora se dá.

campanha:
  titulo: Impresso com cara de marca.
  subtitulo: Raio-X gratuito do seu material, com 30 minutos por vídeo e um PDF com o que melhorar antes da próxima tiragem. Sem compromisso.
  faq: [impresso-grafica, impresso-prazo, impresso-arquivo, impresso-urgente]
