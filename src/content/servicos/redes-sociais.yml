faq:
  - id: redes-quantos-posts
    pergunta: Quantos posts entram por mês?
    resposta: "No serviço avulso, a partir de R$ 1.500/mês, são a partir de 6 posts e 2 Reels por mês, e a quantidade final é combinada na proposta. Na Gestão mensal, por R$ 2.500/mês, 8 posts no feed e 4 criativos de anúncio por mês. Nos dois, implantação única de R$ 1.000 e contrato mínimo de 3 meses."
  - id: redes-aprovacao
    pergunta: Eu aprovo antes de publicar?
    resposta: Sempre. O calendário do mês e cada arte passam pela sua aprovação antes de irem ao ar.
  - id: redes-fotos
    pergunta: Vocês fazem fotos e vídeos?
    resposta: As artes, as legendas e a edição são feitas pelo time. Ensaio fotográfico e gravação ficam à parte e podem ser orçados junto.
  - id: redes-quais-redes
    pergunta: Em quais redes vocês trabalham?
    resposta: Instagram e Facebook na maioria dos casos, e LinkedIn para marcas que vendem para outras empresas. No Raio-X, a gente indica onde vale estar.

