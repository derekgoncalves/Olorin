portfolio:
  titulo: Feed de verdade.
  texto: Conteúdo, campanha e direção de arte para redes sociais.

como_funciona:
  titulo: Do plano ao post.
  etapas:
    - { nome: Raio-X, texto: "Olhamos o seu perfil, os concorrentes e o que o anúncio promete." }
    - { nome: Direção, texto: "Definimos o tom, os temas e o calendário do mês. Você aprova antes de produzir." }
    - { nome: Execução, texto: "Artes e legendas prontas, aprovadas e publicadas no dia certo." }
    - { nome: Leitura, texto: "Todo mês, o que funcionou e o que muda no próximo calendário." }
  prazos:
    - "Até 30 dias: tom de voz definido, primeiro calendário aprovado e o perfil em dia."
    - "Até 60 dias: formatos ajustados pelo que mais engajou e trouxe contato."
    - "Até 90 dias: feed com cara de marca e um ritmo que o público reconhece."

precisamos:
  titulo: Para começar, precisamos de
  itens:
    - Acesso às contas do Instagram e do Facebook (ou do LinkedIn, se for o caso).
    - Logo, fotos e materiais da marca que já existem.
    - Uma pessoa do seu lado para aprovar o calendário e as artes.

para_quem:
  e:
    - Quem anuncia e quer um perfil que confirme o que o anúncio promete.
    - Quem não tem tempo para postar e prefere deixar plano, arte e legenda com um time.
    - Quem quer anúncio e conteúdo com o mesmo time, em vez de um fornecedor para cada coisa.
  nao_e:
    - Quem quer só número de seguidor, sem objetivo por trás.
    - Quem quer viralizar do dia para a noite.

