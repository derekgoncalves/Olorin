  etapas:
    - nome: Raio-X
      texto: Olhamos perfil, anúncios, site e material da marca para ver onde o feed ajuda ou atrapalha a venda.
    - nome: Direção
      texto: Definimos o que falar, para quem e com qual cara. Daí sai o calendário editorial.
    - nome: Execução
      texto: Posts e legendas criados e publicados pelo mesmo time dos seus anúncios.
    - nome: Leitura
      texto: Todo mês, um relatório simples com o que funcionou e o que muda.
  prazos:
    - "[CONFIRMAR: o que acontece nos primeiros 30 dias]"
    - "[CONFIRMAR: o que acontece até os 60 dias]"
    - "[CONFIRMAR: o que acontece até os 90 dias]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Acesso aos perfis da marca nas redes sociais.
    - "[CONFIRMAR: materiais pedidos no início (fotos, vídeos, logotipo, manual de marca)]"
    - Retorno nas aprovações, que são feitas por e-mail.
    - "[CONFIRMAR: escopo das aprovações em redes (calendário editorial, cada post, legendas) e prazo de resposta]"
    - "[CONFIRMAR: quem responde comentários e mensagens no direct (vocês ou a Olorin)]"

preco:
  titulo: Quanto custa
  formato: Faz parte da Gestão mensal
  valor: R$ 2.500/mês
  detalhe: "Junta anúncio e conteúdo, mais R$ 1.000 de implantação, paga uma vez. A verba de anúncio é à parte: recomendamos a partir de R$ 1.500/mês. Quer mais posts e Reels? Veja o [360 completo](/planos/)."
  total: "Custo total de entrada: a partir de R$ 4.000/mês (gestão + verba mínima recomendada)."
  contrato: Contrato mínimo de 3 meses. Depois, mês a mês com aviso de 30 dias, sem multa.
  inclui:
    - Calendário editorial
    - 8 posts no feed por mês, com arte e legenda
    - Anúncios na Meta ou no Google, com 8 peças por mês
    - Relatório mensal e reunião de 30 minutos
    - "[CONFIRMAR: quantos stories por mês e em quais redes sociais]"
  nao_inclui:
    - A verba de anúncio, paga direto à Meta ou ao Google
    - Site, loja virtual e material impresso (à parte ou no 360 completo)
    - "[CONFIRMAR: produção de foto e vídeo (sessão ou gravação) está inclusa ou é à parte]"

combina_com:
  - slug: trafego-pago
    porque: O anúncio leva a pessoa ao perfil, e o feed confirma o que ele prometeu. Na Gestão mensal, os dois andam juntos.
  - slug: identidade-visual
    porque: Com logotipo, cores e manual definidos, todo post sai com a mesma cara.

faq:
  - id: redes-quanto-custa
    pergunta: Quanto custa a gestão de redes sociais?
    resposta: "Está na Gestão mensal: R$ 2.500/mês, mais R$ 1.000 de implantação, com 8 posts no feed por mês e anúncios. No 360 completo, R$ 5.000/mês, mais R$ 1.500 de implantação, são 12 posts e 4 Reels por mês. A verba de anúncio é à parte: recomendamos a partir de R$ 1.500/mês."
  - id: redes-so-redes
    pergunta: Dá para contratar só as redes sociais, sem tráfego pago?
    resposta: "[CONFIRMAR: contratação só de redes sociais — se é possível, em que formato e por quanto]"
  - id: redes-quem-cria
    pergunta: Quem cria os posts e escreve as legendas?
    resposta: O nosso time de criação, o mesmo dos seus anúncios. Não terceirizamos. Por isso o anúncio e o post saem com a mesma cara.
  - id: redes-tempo-resultado
    pergunta: Em quanto tempo vejo resultado nas redes?
    resposta: Marca e conteúdo pedem de 2 a 3 meses de consistência. Anúncios de venda ou de mensagem costumam dar sinais claros em 2 a 4 semanas.
  - id: redes-aprovacao
    pergunta: Posso aprovar o conteúdo antes de ir ao ar?
    resposta: Sim. As aprovações são feitas por e-mail, antes de o conteúdo ir ao ar.
  - id: redes-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A maioria dos clientes é de fora de Curitiba. Tudo é feito a distância: WhatsApp, reuniões por vídeo e aprovações por e-mail."

campanha:
  titulo: O seu feed ajuda ou atrapalha o seu anúncio?
  subtitulo: Raio-X Olorin gratuito do seu perfil, dos anúncios e do site, feito por quem executa. São 30 minutos por vídeo e um PDF com o que mais trava a sua venda. Sem compromisso.
  faq: [redes-quanto-custa, redes-quem-cria, redes-tempo-resultado, redes-fora-curitiba]
