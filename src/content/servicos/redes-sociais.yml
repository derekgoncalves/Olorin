seo:
  title: Gestão de Redes Sociais em Curitiba | Olorin Digital
  description: Calendário editorial, posts, stories e legendas com a mesma cara do seu anúncio e do seu site. Incluso na Gestão mensal, R$ 2.500/mês.

card:
  titulo: Redes sociais
  resumo: Calendário editorial, posts, stories e legendas. Um feed que sustenta o anúncio, em vez de brigar com ele.
  resumo_curto: Calendário, posts, stories e legendas.

hero:
  eyebrow: Gestão de redes sociais em Curitiba e para todo o Brasil
  h1: Um feed que sustenta o anúncio, em vez de brigar com ele.
  sub: Posts, stories e legendas feitos pelo mesmo time que cria os seus anúncios. Quem clica no anúncio e abre o seu perfil encontra a mesma marca.
  janela_linhas:
    - Calendário editorial · planejado
    - Post, story e legenda · no ar
    - Relatório · todo mês

resposta_curta: >-
  Gestão de redes sociais é planejar, criar e publicar posts e legendas com a mesma cara do seu anúncio e
  do seu site. Está inclusa na Gestão mensal, por R$ 2.500/mês, com 8 posts no feed por mês. No 360
  completo, por R$ 5.000/mês, são 12 posts e 4 Reels por mês. A verba de anúncio é à parte. Marca e
  conteúdo pedem de 2 a 3 meses de consistência.

dores:
  titulo: Isso acontece com você?
  itens:
    - O anúncio leva a pessoa ao seu perfil, e o feed (a grade de posts) parece de outra empresa.
    - Você posta quando sobra tempo, e o perfil passa semanas parado.
    - Um fornecedor faz a arte, outro a legenda, outro o anúncio, e ninguém conversa.
    - Cada post sai com uma cor, uma letra e um jeito de falar.

para_quem:
  e:
    - Quem anuncia e quer um perfil que confirme o que o anúncio promete.
    - Quem não tem tempo para postar e prefere deixar plano, arte e legenda com um time.
    - Quem quer anúncio e conteúdo com o mesmo time, em vez de um fornecedor para cada coisa.
  nao_e:
    - 'Quem quer só aparecer. O nosso lema é outro: "Não é sobre aparecer. É sobre vender."'
    - Quem quer "viralizar" do dia para a noite.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal para redes sociais]"

