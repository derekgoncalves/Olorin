seo:
  title: Gestão de Redes Sociais | Olorin Digital
  description: Calendário, posts, Reels e legendas com a cara da sua marca, feitos pelo mesmo time do anúncio. Peça o Raio-X gratuito do seu perfil.

card:
  titulo: Redes sociais
  resumo: Calendário editorial, posts, Reels e legendas que sustentam o anúncio, em vez de brigar com ele.
  resumo_curto: Posts, Reels e legendas com a cara da marca.

hero:
  eyebrow: Gestão de redes sociais
  h1: Feed com cara de marca.
  sub: Posts, Reels e legendas feitos pelo mesmo time que cria os seus anúncios. Quem clica no anúncio e abre o seu perfil encontra a mesma marca.
  selos:
    - Sem multa depois de 3 meses
    - Relatório todo mês
  janela_linhas:
    - Calendário do mês · aprovado
    - Post, Reels e legenda · no ar
    - Relatório · todo mês

resposta_curta: >-
  Gestão de redes sociais é planejar, criar e publicar posts, Reels e legendas com a mesma cara do seu
  anúncio e do seu site. A Olorin monta o calendário do mês com você, cria as artes e as legendas, publica no
  dia certo e mostra, todo mês, o que funcionou e o que muda.

o_que_e:
  titulo: Perfil que confirma a promessa.
  texto:
    - Quando alguém vê o seu anúncio, a primeira coisa que faz é abrir o seu perfil. Se o feed está parado, confuso ou com cara de outra empresa, a venda morre ali.
    - "A Olorin planeja o mês com você, cria as artes e as legendas no tom da sua marca e publica no dia certo. Tudo sai do mesmo time que faz o anúncio, então o feed e a campanha falam a mesma língua."
    - No fim do mês, você vê o que funcionou e o que muda, sem relatório de curtida pela curtida.
  destaques:
    - Calendário aprovado antes de publicar
    - Arte e legenda no mesmo tom
    - O mesmo time do anúncio

dores:
  etiqueta: Este é o seu caso?
  titulo: Perfil parado?
  texto: Se um destes aparece aí, o seu feed está trabalhando contra você.
  itens:
    - { titulo: Posta quando sobra tempo, texto: O perfil passa semanas parado e volta do nada com vários posts no mesmo dia. }
    - { titulo: Cada post de um jeito, texto: "Cada arte sai com uma cor, uma letra e um jeito de falar." }
    - { titulo: Feed contra o anúncio, texto: "O anúncio leva a pessoa ao perfil, e o feed parece de outra empresa." }
    - { titulo: Ninguém conversa, texto: "Um fornecedor faz a arte, outro a legenda, outro o anúncio, e cada um puxa para um lado." }

entregas:
  titulo: O que pode entrar.
  texto: Do calendário do mês ao relatório, com a sua aprovação em cada etapa.
  itens:
    - titulo: Calendário editorial
      texto: O roteiro do que vai ao ar no mês, com tema, formato e data de cada publicação.
      frequencia: todo mês
      icone: relogio
    - titulo: Criativos para o feed
      texto: Posts, carrosséis e vídeos curtos feitos pelo time de design da Olorin, com a cara da sua marca. A quantidade e o formato são combinados com você.
      frequencia: todo mês
      icone: marca
    - titulo: Versão para stories
      texto: Cada post do feed ganha a versão no formato dos stories, para a marca aparecer nos dois lugares.
      frequencia: em cada post
      icone: redes
    - titulo: Legendas no tom certo
      texto: Texto que conversa com quem você quer atrair, com chamada para a ação certa.
      frequencia: em cada post
      icone: mais
    - titulo: Publicação no dia
      texto: Tudo agendado e publicado no dia e na hora do calendário aprovado.
      frequencia: toda semana
      icone: check
    - titulo: Leitura do mês
      texto: O que deu resultado, o que não deu e o que muda no próximo calendário.
      frequencia: todo mês
      icone: dados

portfolio:
  titulo: Feed de verdade.
  texto: Conteúdo, campanha e direção de arte para redes sociais.

combina_com:
  - slug: trafego-pago
    porque: O feed ganha gente nova e o anúncio ganha um perfil que confirma a promessa. Com o mesmo time, os dois andam juntos.
  - slug: identidade-visual
    porque: Com uma identidade clara, cada post sai mais rápido e com a mesma cara.

campanha:
  titulo: Seu feed está espantando cliente?
  subtitulo: Raio-X gratuito do seu perfil, com 30 minutos por vídeo e um PDF com o que trava o seu conteúdo. Sem compromisso.
