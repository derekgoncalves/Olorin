resposta_curta: >-
  Gestão de redes sociais é planejar, criar e publicar posts, Reels e legendas com a mesma cara do seu
  anúncio e do seu site. Sozinha, sai a partir de R$ 1.500/mês, com a partir de 6 posts e 2 Reels por mês;
  com o tráfego pago junto, na Gestão mensal, R$ 2.500/mês, com 8 posts no feed e 4 criativos de anúncio por
  mês. Nos dois formatos, implantação única de R$ 1.000 e contrato mínimo de 3 meses.

o_que_e:
  titulo: Perfil que confirma a promessa.
  texto:
    - Quando alguém vê o seu anúncio, a primeira coisa que faz é abrir o seu perfil. Se o feed está parado, confuso ou com cara de outra empresa, a venda morre ali.
    - "A Olorin planeja o mês com você, cria as artes e as legendas no tom da sua marca e publica no dia certo. Tudo sai do mesmo time que faz o anúncio, então o feed e a campanha falam a mesma língua."
    - No fim do mês, você vê o que funcionou e o que muda, sem relatório de curtida pela curtida.
  destaques:
    - Calendário aprovado antes de publicar
    - Arte e legenda no mesmo tom
    - O mesmo time do anúncio

dores:
  titulo: Perfil parado?
  texto: Se um destes aparece aí, o seu feed está trabalhando contra você.
  itens:
    - { titulo: Posta quando sobra tempo, texto: O perfil passa semanas parado e volta do nada com três posts no mesmo dia. }
    - { titulo: Cada post de um jeito, texto: "Cada arte sai com uma cor, uma letra e um jeito de falar." }
    - { titulo: Feed contra o anúncio, texto: "O anúncio leva a pessoa ao perfil, e o feed parece de outra empresa." }
    - { titulo: Ninguém conversa, texto: "Um fornecedor faz a arte, outro a legenda, outro o anúncio, e cada um puxa para um lado." }

