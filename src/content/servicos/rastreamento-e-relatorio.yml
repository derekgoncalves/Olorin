faq:
  - id: rastreamento-o-que-e
    pergunta: O que é rastreamento?
    resposta: "É configurar as ferramentas que contam o que acontece no site e nos anúncios (Google Tag Manager, Google Analytics, pixel da Meta e conversões), para cada venda, matrícula ou contato chegar ao relatório com a sua origem."
  - id: rastreamento-quanto-custa
    pergunta: Quanto custa?
    resposta: "Sozinho, a partir de R$ 1.500/mês, sem taxa de implantação e com contrato mínimo de 3 meses. Na Gestão mensal e no Marketing 360, a configuração já vem na implantação e o relatório vem todo mês."
  - id: rastreamento-gestao-mensal
    pergunta: Já vem na Gestão mensal?
    resposta: "Sim. Na Gestão mensal e no Marketing 360, o rastreamento é configurado na implantação, e o relatório mensal faz parte do plano."
  - id: rastreamento-ja-tenho
    pergunta: Já tenho Google Analytics. Preciso disso?
    resposta: Talvez não do zero. No Raio-X conferimos o que já está instalado e se os números fecham. Muitas vezes o ajuste é pequeno.
  - id: rastreamento-relatorio
    pergunta: Como é o relatório?
    resposta: "Uma página com quanto foi investido, quanto voltou e o que muda na próxima rodada, em linguagem simples. Veja um [exemplo ilustrativo](/como-trabalhamos/#relatorio)."
  - id: rastreamento-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A Olorin atende todo o Brasil a distância: WhatsApp, reunião por vídeo e aprovação por e-mail."

campanha:
  titulo: Pare de decidir no escuro.
  subtitulo: Raio-X gratuito do seu rastreamento, com 30 minutos por vídeo e um PDF com o que está contando errado. Sem compromisso.
  faq: [rastreamento-o-que-e, rastreamento-quanto-custa, rastreamento-ja-tenho, rastreamento-fora-curitiba]
