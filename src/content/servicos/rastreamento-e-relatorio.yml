# Resumo usado na landing /promo/, no llms.txt e no JSON-LD (não aparece com rótulo na página do serviço).
resposta_curta: >-
  Rastreamento é configurar o Google Tag Manager, o Google Analytics, o pixel da Meta e as conversões para cada
  venda, matrícula ou contato chegar ao relatório com a sua origem. A Olorin configura, confere cada evento,
  monta um painel simples e faz, todo mês, a leitura do que os números pedem.

o_que_e:
  titulo: Número que fecha.
  texto:
    - "Sem rastreamento, o anúncio otimiza no escuro e o relatório mostra o que é fácil de contar, não o que importa. Com ele, cada venda, matrícula ou contato chega com a sua origem: qual anúncio, qual página, qual campanha."
    - A Olorin configura o Google Tag Manager, o Google Analytics 4, o pixel da Meta e as conversões do Google Ads, confere se cada evento chega certo e monta um painel simples, que você abre quando quiser.
    - "Todo mês, a leitura vira decisão: onde investir mais, o que cortar e o que testar."
  destaques:
    - Conversões conferidas
    - Painel que qualquer pessoa entende
    - Leitura que vira decisão

dores:
  etiqueta: Este é o seu caso?
  titulo: Número que não fecha?
  texto: Se um destes aparece aí, as suas decisões estão sendo tomadas no escuro.
  itens:
    - { titulo: Venda sem origem, texto: "Chegam vendas e contatos, mas ninguém sabe de qual anúncio ou página vieram." }
    - { titulo: Números que brigam, texto: "O Google Analytics, a Meta e a planilha mostram números diferentes para a mesma coisa." }
    - { titulo: Pixel quebrado, texto: O pixel ou a conversão parou de funcionar e ninguém percebeu. }
    - { titulo: Relatório sem resposta, texto: O relatório tem muito gráfico e nenhuma resposta sobre o que fazer. }

entregas:
  titulo: O que pode entrar.
  texto: Da configuração ao painel, para cada resultado chegar com a sua origem.
  itens:
    - titulo: Google Tag Manager
      texto: Contêiner organizado, com cada etiqueta nomeada e documentada.
      frequencia: no início
      icone: site
    - titulo: Google Analytics 4
      texto: "Eventos e conversões que contam venda, matrícula e contato, não só visita."
      frequencia: no início
      icone: dados
    - titulo: Pixel e conversões
      texto: Pixel da Meta e conversões do Google Ads conferidos, para o anúncio otimizar certo.
      frequencia: no início
      icone: trafego
    - titulo: Origem de cada contato
      texto: Links etiquetados (UTM) e formulários que guardam de onde a pessoa veio.
      frequencia: em toda campanha
      icone: seta
    - titulo: Painel de acompanhamento
      texto: Investimento, resultado e retorno num painel simples, que você abre quando quiser.
      frequencia: acesso a qualquer hora
      icone: estrela
    - titulo: Leitura mensal
      texto: Os números do mês em linguagem simples e o que muda na próxima rodada.
      frequencia: todo mês
      icone: relogio

# Bloco de logos: o que o time configura e lê (arquivos em /assets/img/marcas/<logo>.svg). Sem nome de ferramenta de painel.
