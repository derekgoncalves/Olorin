resposta_curta: >-
  Rastreamento é fazer o seu site e os seus anúncios contarem o que acontece depois do clique:
  quem visitou, quem mandou mensagem e quem comprou. Configuramos as ferramentas que registram isso:
  Google Tag Manager, Google Analytics 4 (GA4), pixel da Meta e conversões do Google Ads. O pixel é o
  código que conta à Meta (Instagram e Facebook) quem visitou e quem comprou; conversão é cada venda,
  mensagem ou cadastro. Depois, juntamos tudo num painel que mostra quanto entrou, quanto saiu e qual foi
  o retorno. É para quem anuncia ou vende pela internet e não sabe dizer quanto custou cada venda. O preço
  vem aberto na proposta, sem letra miúda.

dores:
  titulo: Isso acontece com você?
  itens:
    - Você investe em anúncio todo mês e não sabe dizer quanto custou cada venda.
    - O relatório mostra alcance e impressões, mas nunca mostra faturamento.
    - Ninguém sabe dizer se o pixel está instalado, nem o que ele está contando.
    - Cada ferramenta mostra um número diferente, e você não sabe em qual acreditar.

para_quem:
  e:
    - Quem anuncia na Meta (Instagram e Facebook) ou no Google e quer saber quanto cada campanha devolveu.
    - Quem vende pelo site ou pela loja virtual e quer enxergar o caminho do anúncio até o pedido.
    - Quem vai colocar um site novo no ar e quer que ele já nasça medindo o que importa.
    - Quem recebe relatório cheio de sigla e quer um que qualquer pessoa entenda.
  nao_e:
    - Quem quer um relatório bonito só com alcance e curtidas. O nosso mostra faturamento.
    - Quem espera que o rastreamento, sozinho, faça vender mais. Ele mostra o que funciona; a venda vem da campanha, do site e da oferta.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal para rastreamento e relatório]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Google Tag Manager (GTM)
      texto: O GTM é uma central que guarda, num lugar só, os códigos de medição do seu site. Com ele, dá para ajustar o que é medido sem mexer no código do site a cada mudança.
      icone: site
    - titulo: Google Analytics 4 (GA4)
      texto: O GA4 é a ferramenta do Google que mostra quantas pessoas visitaram o seu site, de onde vieram e o que fizeram lá dentro. Deixamos o GA4 configurado para contar o que importa para você, como venda, mensagem e cadastro.
      icone: dados
    - titulo: Pixel da Meta
      texto: O pixel é um código instalado no site que conta à Meta (Instagram e Facebook) quem visitou e quem comprou. Assim, a campanha aprende com quem compra, e não só com quem clica.
      icone: pixel
    - titulo: Conversões do Google Ads
      texto: Conversão é a ação que vale dinheiro para você — uma venda, uma mensagem, um cadastro. Configuramos o Google Ads para registrar cada uma e mostrar qual anúncio trouxe o resultado.
      icone: trafego
    - titulo: Painel de acompanhamento
      texto: Os números de anúncio e de site num lugar só — investimento, faturamento atribuído (o que as campanhas trouxeram em vendas), custo por venda e retorno.
      icone: dados
    - titulo: Relatório com faturamento, não só alcance
      texto: "Em linguagem simples: quanto entrou, quanto saiu, qual foi o retorno e o que muda na próxima rodada. Siglas como ROAS (quanto voltou em faturamento para cada R$ 1 investido em anúncio) vêm explicadas. Veja um [exemplo ilustrativo](/#relatorio)."
      frequencia: todo mês na Gestão mensal
      icone: relogio
    - titulo: Conferência depois da configuração
      texto: "[CONFIRMAR: se há conferência periódica do rastreamento depois de configurado, e com que frequência]"
      icone: check
    - titulo: Ferramenta do painel
      texto: "[CONFIRMAR: em qual ferramenta o painel de acompanhamento é montado e como o cliente acessa]"
      icone: mais

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Diagnóstico
      texto: Olhamos o que já existe — site, contas de anúncio, GTM, GA4 e pixel. Descobrimos o que está medindo certo, o que está faltando e o que está repetido.
    - nome: Direção
      texto: Definimos o que vale medir no seu negócio (venda, mensagem ou cadastro) e quais números o relatório precisa mostrar para você decidir.
    - nome: Execução
      texto: Configuramos o GTM, o GA4, o pixel da Meta e as conversões do Google Ads, e montamos o painel de acompanhamento. Tudo para o dado chegar certo em cada ferramenta.
    - nome: Leitura
      texto: O relatório mostra quanto entrou, quanto saiu, qual foi o retorno e o que vem na próxima rodada. Na Gestão mensal, ele chega todo mês.
  prazos:
    - "[CONFIRMAR: o que acontece nos primeiros 30 dias (prazo para configurar o rastreamento)]"
    - "[CONFIRMAR: o que acontece até os 60 dias]"
    - "[CONFIRMAR: o que acontece até os 90 dias]"

