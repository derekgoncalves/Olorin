  description: Google Tag Manager, pixel, conversões e painel de acompanhamento para saber quanto entrou, quanto saiu e qual foi o retorno.

card:
  titulo: Dados
  resumo: Google Tag Manager, pixel da Meta e painel para saber quanto cada anúncio vendeu.
  resumo_curto: Medição do site e dos anúncios, com painel de acompanhamento.

hero:
  eyebrow: Rastreamento com Google Tag Manager e Google Analytics em Curitiba e para todo o Brasil
  h1: Se o dado não chega certo, nada depois disso funciona.
  sub: Google Tag Manager, Google Analytics, pixel da Meta e conversões do Google Ads configurados para mostrar quanto entrou, quanto saiu e qual foi o retorno.
  janela_linhas:
    - GTM e GA4 · configurados
    - Pixel e conversões · configurados
    - Relatório · com faturamento

resposta_curta: >-
  Rastreamento é fazer o site e os anúncios contarem o que acontece depois do clique: quem visitou, quem
  mandou mensagem e quem comprou. Configuramos as ferramentas que registram isso e juntamos tudo num
  relatório com quanto entrou, quanto saiu e qual foi o retorno. Vem incluso no Arranque 30 dias e na
  implantação da Gestão mensal e do 360 completo.

dores:
  titulo: Isso acontece com você?
  itens:
    - Você investe em anúncio todo mês e não sabe quanto custou cada venda.
    - O relatório mostra alcance e impressões, nunca faturamento.
    - Ninguém sabe se o pixel está instalado, nem o que ele conta.
    - Cada ferramenta mostra um número diferente, e você não sabe em qual acreditar.

para_quem:
  e:
    - Quem anuncia na Meta ou no Google e quer saber quanto cada campanha devolveu.
    - Quem vende pelo site ou pela loja virtual e quer ver o caminho do anúncio até o pedido.
    - Quem vai lançar um site e quer que ele já nasça medindo o que importa.
  nao_e:
    - Quem quer relatório só com alcance e curtidas. O nosso mostra faturamento.
    - Quem espera que medir, sozinho, faça vender mais. A venda vem da campanha, do site e da oferta.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal para rastreamento e relatório]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Google Tag Manager (GTM)
      texto: Uma central com os códigos de medição do site, para ajustar o que é medido sem mexer no código.
      icone: site
    - titulo: Google Analytics 4 (GA4)
      texto: Mostra quem visitou o site, de onde veio e o que fez. Configurado para contar venda, mensagem ou cadastro.
      icone: dados
    - titulo: Pixel da Meta
      texto: Conta à Meta (Instagram e Facebook) quem visitou e quem comprou, para a campanha aprender com quem compra.
      icone: pixel
    - titulo: Conversões do Google Ads
      texto: Registram cada venda, mensagem ou cadastro e mostram qual anúncio trouxe o resultado.
      icone: trafego
    - titulo: Painel de acompanhamento
      texto: Investimento, faturamento atribuído (o que as campanhas trouxeram em vendas), custo por venda e retorno, num lugar só.
      icone: dados
    - titulo: Relatório com faturamento, não só alcance
      texto: Quanto entrou, quanto saiu e o que muda, com toda sigla explicada. Veja um [exemplo ilustrativo](/como-trabalhamos/#relatorio).
      frequencia: todo mês nos planos mensais
      icone: relogio
    - titulo: Conferência depois da configuração
      texto: "[CONFIRMAR: se há conferência periódica do rastreamento depois de configurado, e com que frequência]"
      icone: check
    - titulo: Ferramenta do painel
      texto: "[CONFIRMAR: em qual ferramenta o painel de acompanhamento é montado e como o cliente acessa]"
      icone: mais

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Raio-X
      texto: Vemos no site e nas contas de anúncio o que mede certo, o que falta e o que está repetido.
    - nome: Direção
      texto: Definimos o que vale medir (venda, mensagem ou cadastro) e o que o relatório precisa mostrar.
    - nome: Execução
      texto: Configuramos as ferramentas e montamos o painel.
    - nome: Leitura
      texto: Quanto entrou, quanto saiu e qual foi o retorno. Nos planos mensais, o relatório chega todo mês.
  prazos:
    - "[CONFIRMAR: o que acontece nos primeiros 30 dias (prazo para configurar o rastreamento)]"
    - "[CONFIRMAR: o que acontece até os 60 dias]"
    - "[CONFIRMAR: o que acontece até os 90 dias]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Acesso ao site ou à loja virtual para instalar e conferir os códigos.
    - "Acesso às contas que já existem: Google Tag Manager, Google Analytics, Meta e Google Ads."
    - "Dizer o que conta como resultado: venda, mensagem ou cadastro."
    - "[CONFIRMAR: dados de venda pedidos para o relatório (faturamento, vendas fora do site, margens)]"

preco:
  titulo: Quanto custa
  formato: Incluso nos planos
  valor: "[CONFIRMAR: valor do rastreamento contratado sozinho, fora dos planos]"
  sem_valor: Quer só o rastreamento? Conte no formulário o que você usa hoje. Respondemos em até 1 dia útil, com o preço aberto na proposta.
  detalhe: Vem no Arranque 30 dias (a partir de R$ 1.800, uma vez). Na Gestão mensal e no 360 completo, entra na implantação (R$ 1.000 e R$ 1.500). Verba de anúncio à parte. Veja os [planos](/planos/).
  contrato: Arranque sem contrato mensal. Gestão mensal e 360 com mínimo de 3 meses; depois, mês a mês, sem multa.
  inclui:
    - Google Tag Manager e Google Analytics configurados
    - Pixel da Meta e conversões do Google Ads
    - Painel com investimento, faturamento atribuído, custo por venda e retorno
    - Relatório em linguagem simples, com faturamento
  nao_inclui:
    - A verba de anúncio, paga direto à Meta ou ao Google
    - A criação do site ou da loja virtual

combina_com:
  - slug: trafego-pago
    porque: Com o dado certo, a otimização semanal das campanhas mira a venda, e não o clique.
  - slug: site-e-loja-virtual
    porque: Feitos pelo mesmo time, o site e a loja virtual já nascem medindo o que importa.

faq:
  - id: rastreamento-o-que-e
    pergunta: O que é rastreamento, na prática?
    resposta: "São códigos que registram o que a pessoa faz depois do clique: se mandou mensagem, fez cadastro ou comprou. Sem eles, o relatório não mostra faturamento."
  - id: rastreamento-quanto-custa
    pergunta: Quanto custa o rastreamento?
    resposta: Vem incluso no Arranque 30 dias (a partir de R$ 1.800, uma vez) e na implantação da Gestão mensal e do 360 completo. Quer só o rastreamento? Conte no formulário o que usa hoje e respondemos em até 1 dia útil, com preço aberto.
  - id: rastreamento-gestao-mensal
    pergunta: O rastreamento já está incluso na Gestão mensal?
    resposta: "Sim. A configuração entra na implantação, paga uma vez: R$ 1.000 na Gestão mensal e R$ 1.500 no 360 completo."
  - id: rastreamento-ja-tenho
    pergunta: Já tenho pixel e Google Analytics instalados. Ainda preciso disso?
    resposta: "Instalado não quer dizer funcionando certo. Conferimos o que existe: o que mede certo, o que falta e o que está repetido. Para começar sem custo, peça o Raio-X Olorin."
  - id: rastreamento-relatorio
    pergunta: O que aparece no relatório?
    resposta: Quanto foi investido, quanto voltou em faturamento, quanto custou cada venda e o retorno, comparado ao mês anterior. Siglas como ROAS (quanto voltou para cada R$ 1 em anúncio) vêm explicadas. Veja um [exemplo ilustrativo](/como-trabalhamos/#relatorio).
  - id: rastreamento-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A maioria dos clientes é de fora de Curitiba. Tudo é feito a distância: WhatsApp, reuniões por vídeo e aprovações por e-mail."

campanha:
  titulo: Você sabe quanto custou cada venda?
  subtitulo: Raio-X Olorin gratuito do rastreamento do seu site e dos anúncios, com 30 minutos por vídeo e um PDF com o que mais trava a sua venda. Sem compromisso.
  faq: [rastreamento-o-que-e, rastreamento-quanto-custa, rastreamento-ja-tenho, rastreamento-fora-curitiba]
