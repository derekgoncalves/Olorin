portfolio:
  titulo: Na prática.
  texto: Trabalhos em que a medição mostrou onde estava o resultado.

como_funciona:
  titulo: Do Raio-X ao painel.
  etapas:
    - { nome: Raio-X, texto: "Conferimos o que já existe: etiquetas, pixel, conversões e o caminho até o contato." }
    - { nome: Plano, texto: "Definimos o que contar (venda, matrícula, contato) e onde cada número vai aparecer." }
    - { nome: Configuração, texto: "Tag Manager, Analytics, pixel e conversões configurados e testados um a um." }
    - { nome: Leitura, texto: Painel no ar e leitura mensal do que os números dizem. }
  prazos:
    - "Até 30 dias: rastreamento configurado e testado, e o painel no ar."
    - "Até 60 dias: o primeiro mês completo de dados e o ajuste do que não fechou."
    - "Até 90 dias: comparação entre meses e as decisões de verba e de página que ela pede."

precisamos:
  titulo: Para começar, precisamos de
  itens:
    - Acesso ao site, ao Google Tag Manager e ao Google Analytics (se não tiver, a gente cria).
    - Acesso de gestão às contas de anúncio da Meta e do Google.
    - Os dados de venda combinados com você no início, para o relatório fechar a conta.

para_quem:
  e:
    - Quem anuncia e não sabe quanto cada campanha vendeu.
    - Quem tem site, loja ou página de captação e quer saber de onde vem cada contato.
    - Quem precisa de números confiáveis para decidir verba e prioridade.
  nao_e:
    - Quem quer só um relatório bonito, sem mudar nada a partir dele.
    - Quem ainda não tem site nem anúncio. Aí o Raio-X gratuito mostra por onde começar.

