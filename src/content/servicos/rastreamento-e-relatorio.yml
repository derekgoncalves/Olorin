faq:
  - id: rastreamento-o-que-e
    pergunta: O que é rastreamento, na prática?
    resposta: "São os códigos que registram o que a pessoa faz depois do clique no anúncio ou da visita ao site. Por exemplo: se mandou mensagem, se fez cadastro ou se comprou. Sem isso, a Meta e o Google só enxergam o clique, e o relatório não consegue mostrar faturamento."
  - id: rastreamento-quanto-custa
    pergunta: Quanto custa o rastreamento?
    resposta: Conte no formulário o que você usa hoje (site, loja virtual, contas de anúncio). Respondemos em até 1 dia útil, com o preço aberto na proposta, sem letra miúda.
  - id: rastreamento-gestao-mensal
    pergunta: O rastreamento já está incluso na Gestão mensal?
    resposta: "[CONFIRMAR: se a configuração do rastreamento está inclusa na Gestão mensal e no 360 completo, ou se é contratada à parte]"
  - id: rastreamento-ja-tenho
    pergunta: Já tenho pixel e Google Analytics instalados. Ainda preciso disso?
    resposta: Instalado não quer dizer funcionando certo. No diagnóstico, olhamos o que já existe e mostramos o que está medindo certo, o que falta e o que está repetido. Assim, você decide com base no que encontramos.
  - id: rastreamento-relatorio
    pergunta: O que aparece no relatório?
    resposta: Na Gestão mensal, o relatório chega todo mês e mostra quanto foi investido, quanto voltou em faturamento, quanto custou cada venda e qual foi o retorno, na comparação com o mês anterior. Também mostra o que vamos fazer na próxima rodada. Siglas como ROAS (quanto voltou em faturamento para cada R$ 1 investido em anúncio) vêm explicadas. Veja um [exemplo ilustrativo](/#relatorio).
  - id: rastreamento-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: Sim. A maioria dos clientes é de outras cidades. O atendimento é 100% remoto, com reuniões por vídeo e aprovações por e-mail.

