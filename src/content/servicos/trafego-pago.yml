    - Relatório · todo mês

# Resumo usado na landing /promo/, no llms.txt e no JSON-LD (não aparece com rótulo na página do serviço).
resposta_curta: >-
  Gestão de tráfego pago é planejar, montar e ajustar os seus anúncios na Meta (Instagram e Facebook) e no
  Google para buscar venda, matrícula ou contato. A Olorin cria as peças, ajusta as campanhas toda semana e
  manda um relatório por mês com quanto foi investido e quanto voltou. A verba de anúncio fica na sua conta,
  paga direto à Meta ou ao Google.

o_que_e:
  titulo: Cada real com destino.
  texto:
    - "Tráfego pago é o anúncio que aparece para quem tem cara de cliente: no Instagram e no Facebook (Meta Ads), para quem ainda não conhece você, e no Google (Google Ads), para quem já está procurando o que você vende."
    - A Olorin monta as campanhas pelo objetivo do seu negócio, seja venda, matrícula, contato ou inscrição, cria as peças com a cara da sua marca e ajusta tudo toda semana pelo que vende, não pelo que dá curtida.
    - "No fim do mês, chega um relatório que qualquer pessoa entende: quanto foi investido, quanto voltou e o que muda na próxima rodada."
  destaques:
    - Otimização toda semana
    - Peças com a cara da marca
    - Relatório com retorno, não com curtida

dores:
  etiqueta: Este é o seu caso?
  titulo: Dinheiro no escuro?
  texto: Se um destes aparece aí, a sua conta de anúncio precisa de revisão.
  itens:
    - { titulo: Sem saber o custo, texto: Você investe todo mês e não sabe quanto custou cada venda ou cada contato. }
    - { titulo: Relatório de vaidade, texto: "O relatório mostra alcance e impressões, nunca faturamento, matrícula ou pedido." }
    - { titulo: Conta bagunçada, texto: A conta virou um amontoado de campanhas antigas e públicos repetidos. }
    - { titulo: Promessa quebrada, texto: "O anúncio promete uma coisa, o site mostra outra, e a pessoa desiste no caminho." }

entregas:
  titulo: O que pode entrar.
  texto: Da estrutura da conta ao relatório do mês, com o mesmo time.
  itens:
    - titulo: Campanhas por objetivo
      texto: Estrutura separada para venda, matrícula, contato ou reconhecimento, cada uma com a sua meta.
      frequencia: no início
      icone: trafego
    - titulo: Públicos limpos
      texto: Segmentações sem sobreposição, para o anúncio chegar em quem tem cara de cliente.
      frequencia: revisados toda semana
      icone: dados
    - titulo: Peças com a cara da marca
      texto: Criativos feitos pelo time de design da Olorin, com a mesma cara do feed e do site.
      frequencia: todo mês
      icone: marca
    - titulo: Otimização semanal
      texto: Verba, públicos e anúncios ajustados pelo que vende, e não no achismo.
      frequencia: toda semana
      icone: relogio
    - titulo: Rastreamento certo
      texto: Pixel, conversões e etiquetas configurados, para cada resultado chegar ao relatório.
      frequencia: no início
      icone: site
    - titulo: Relatório com retorno
      texto: Quanto entrou, quanto saiu e o que muda, em linguagem simples.
      frequencia: todo mês
      icone: dados

