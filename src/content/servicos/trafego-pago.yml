# Resumo usado na landing /promo/ e no JSON-LD (não aparece com rótulo na página do serviço).
resposta_curta: >-
  Gestão de tráfego pago é planejar, montar e ajustar os seus anúncios na Meta (Instagram e Facebook) e no
  Google para buscar venda, matrícula ou contato. Sozinha, a gestão sai a partir de R$ 1.500/mês; com as redes
  sociais junto, na Gestão mensal, R$ 2.500/mês. Nos dois formatos, implantação única de R$ 1.000 e contrato
  mínimo de 3 meses. A verba de anúncio é à parte, paga direto à Meta ou ao Google, e recomendamos a partir
  de R$ 1.500/mês.

o_que_e:
  titulo: Cada real com destino.
  texto:
    - "Tráfego pago é o anúncio que aparece para quem tem cara de cliente: no Instagram e no Facebook (Meta Ads), para quem ainda não conhece você, e no Google (Google Ads), para quem já está procurando o que você vende."
    - A Olorin monta as campanhas pelo objetivo do seu negócio, seja venda, matrícula, contato ou inscrição, cria as peças com a cara da sua marca e ajusta tudo toda semana pelo que dá resultado, não pelo que dá curtida.
    - "No fim do mês, chega um relatório que qualquer pessoa entende: quanto foi investido, quanto voltou e o que muda na próxima rodada. Resultado que dá pra ver."
  destaques:
    - Otimização toda semana
    - Peças com a cara da marca
    - Relatório com retorno, não com curtida

dores:
  titulo: Dinheiro no escuro?
  texto: Se um destes aparece aí, a sua conta de anúncio precisa de revisão.
  itens:
    - { titulo: Sem saber o custo, texto: Você investe todo mês e não sabe quanto custou cada venda ou cada contato. }
    - { titulo: Relatório de vaidade, texto: "O relatório mostra alcance e impressões, nunca faturamento, matrícula ou pedido." }
    - { titulo: Conta bagunçada, texto: A conta virou um amontoado de campanhas antigas e públicos repetidos. }
    - { titulo: Promessa quebrada, texto: "O anúncio promete uma coisa, o site mostra outra, e a pessoa desiste no caminho." }

entregas:
  titulo: O que entra.
  texto: Da estrutura da conta ao relatório do mês, com o mesmo time.
  itens:
    - titulo: Campanhas por objetivo
      texto: Estrutura separada para venda, matrícula, contato ou reconhecimento, cada uma com a sua meta.
      frequencia: na implantação
      icone: trafego
    - titulo: Públicos limpos
      texto: Segmentações sem sobreposição, para o anúncio chegar em quem tem cara de cliente.
      frequencia: revisados toda semana
      icone: dados
    - titulo: Peças com a cara da marca
      texto: Criativos feitos pelo time de design da Olorin, com a mesma cara do feed e do site.
      frequencia: todo mês
      icone: marca
    - titulo: Otimização semanal
      texto: Verba, públicos e anúncios ajustados pelo que vende, e não no achismo.
      frequencia: toda semana
      icone: relogio
    - titulo: Rastreamento certo
      texto: Pixel, conversões e etiquetas configurados, para cada resultado chegar ao relatório.
      frequencia: na implantação
      icone: site
    - titulo: Relatório com retorno
      texto: Quanto entrou, quanto saiu e o que muda, em linguagem simples. Veja um [exemplo ilustrativo](/como-trabalhamos/#relatorio).
      frequencia: todo mês
      icone: dados

portfolio:
  titulo: Na prática.
  texto: Campanhas e peças de anúncio feitas pelo time da Olorin.

como_funciona:
  titulo: Do Raio-X ao relatório.
  etapas:
    - { nome: Raio-X, texto: "Olhamos a conta de anúncio, o site e o rastreamento para achar onde o dinheiro escapa." }
    - { nome: Direção, texto: "Definimos objetivo, público e verba de cada campanha. Você aprova antes de ir ao ar." }
    - { nome: Execução, texto: "Campanhas no ar, peças do nosso time e ajuste toda semana." }
    - { nome: Leitura, texto: "Todo mês, quanto entrou, quanto saiu e o que muda na próxima rodada." }
  prazos:
    - "Até 30 dias: conta organizada, rastreamento conferido e as primeiras campanhas no ar."
    - "Até 60 dias: públicos e peças ajustados pelo que deu resultado no primeiro mês."
    - "Até 90 dias: verba concentrada no que dá retorno e a meta do trimestre seguinte."

precisamos:
  titulo: Para começar, precisamos de
  itens:
    - Acesso à conta de anúncio da Meta ou do Google (se não tiver, a gente ajuda a criar).
    - Acesso ao site ou à página de destino, para conferir o rastreamento.
    - Os materiais e as informações do negócio que a campanha pede, combinados com você no início.
    - Aprovação do plano e das peças antes de irem ao ar.

para_quem:
  e:
    - Quem já anuncia e quer saber quanto cada campanha devolveu.
    - Quem vende pelo site, pelo WhatsApp ou na matrícula e quer mais resultado com o mesmo investimento.
    - Quem tem a partir de R$ 1.500 por mês para anúncio, além da gestão.
  nao_e:
    - Quem procura resultado garantido ou quer viralizar do dia para a noite.
    - Quem ainda não tem verba para anúncio. Aí o Raio-X gratuito mostra por onde começar.

preco:
  titulo: Preço aberto.
  formato: Gestão de tráfego pago
  rotulo: A partir de
  valor: R$ 1.500/mês
  detalhe: "Sozinha, para uma plataforma (Meta ou Google). Com as redes sociais junto, na Gestão mensal: R$ 2.500/mês, com 4 criativos de anúncio e 8 posts no feed por mês. Nos dois formatos, implantação única de R$ 1.000 e contrato mínimo de 3 meses. A verba de anúncio é à parte, paga direto à Meta ou ao Google, e recomendamos a partir de R$ 1.500/mês."
  total: "Custo por mês a partir de R$ 3.000 (gestão + verba mínima recomendada), mais a implantação de R$ 1.000 no início."
  contrato: Depois de 3 meses, segue mês a mês com aviso de 30 dias, sem multa.
  inclui:
    - Campanhas na Meta ou no Google
    - Peças de anúncio com a cara da marca
    - Otimização semanal
    - Relatório mensal com retorno
  nao_inclui:
    - A verba de anúncio (vai direto para a plataforma, na sua conta)
    - Meta e Google ao mesmo tempo (no [Marketing 360](/planos/))
    - Site, loja e impresso (à parte ou no Marketing 360)
  schema:
    valor: "1500"
    minimo: true
    unidade: MON
    descricao: Gestão de tráfego pago (Meta Ads ou Google Ads) a partir de R$ 1.500 por mês, com implantação de R$ 1.000 e contrato mínimo de 3 meses. Verba de anúncio à parte.

combina_com:
  - slug: redes-sociais
    porque: O anúncio vende mais quando o feed confirma o que ele promete. Na Gestão mensal, os dois andam juntos.
  - slug: rastreamento-e-relatorio
    porque: Sem pixel e conversões, a otimização trabalha no escuro.

faq:
  - id: trafego-quanto-investir
    pergunta: Quanto preciso investir por mês?
    resposta: "A gestão sai a partir de R$ 1.500/mês, ou R$ 2.500/mês na Gestão mensal, com as redes sociais junto. Nos dois, implantação única de R$ 1.000 e contrato mínimo de 3 meses. A verba de anúncio vai direto para a Meta ou o Google, e recomendamos a partir de R$ 1.500/mês. Na [calculadora](/planos/#calculadora) a conta sai na hora."
  - id: trafego-tempo-resultado
    pergunta: Em quanto tempo vejo resultado?
    resposta: Campanhas de venda e de contato costumam dar os primeiros sinais em 2 a 4 semanas. Campanhas de marca pedem de 2 a 3 meses de constância. Não existe resultado garantido, mas o relatório mostra desde o primeiro mês o que está funcionando.
  - id: trafego-meta-ou-google
    pergunta: Meta Ads ou Google Ads, qual escolher?
    resposta: "Depende de onde está o seu cliente. No Google, você aparece para quem já procura o que você vende. Na Meta, chega em quem ainda não te conhece. A gestão avulsa e a Gestão mensal cobrem uma plataforma; o Marketing 360, as duas."
  - id: trafego-dono-conta
    pergunta: Quem é o dono da conta de anúncio?
    resposta: Você. A conta fica no seu nome e no seu cartão, e a Olorin entra como parceira, com acesso de gestão. Se um dia o trabalho acabar, tudo continua com você.
  - id: trafego-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A Olorin atende todo o Brasil a distância: WhatsApp, reunião por vídeo e aprovação por e-mail."

campanha:
  titulo: Pare de pagar anúncio que não volta.
  subtitulo: Raio-X gratuito da sua conta de anúncio, com 30 minutos por vídeo e um PDF com o que mais trava a sua venda. Sem compromisso.
  faq: [trafego-quanto-investir, trafego-tempo-resultado, trafego-meta-ou-google, trafego-fora-curitiba]
