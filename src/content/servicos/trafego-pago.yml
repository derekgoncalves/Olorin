  subtitulo: Raio-X gratuito da sua conta de Meta Ads e Google Ads, feito por quem executa. Sem compromisso.
  faq: [trafego-quanto-investir, trafego-tempo-resultado, trafego-meta-ou-google, trafego-fora-curitiba]
