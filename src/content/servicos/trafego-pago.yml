  resumo: Meta Ads e Google Ads para venda, matrícula e contato, com otimização toda semana.
  resumo_curto: Meta Ads e Google Ads com otimização semanal.

hero:
  eyebrow: Gestão de tráfego pago
  h1: Anúncios que lucram.
