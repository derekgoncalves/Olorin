combina_com:
  - slug: redes-sociais
    porque: O anúncio vende melhor quando o feed confirma o que ele promete. Na Gestão mensal, os dois já andam juntos.
  - slug: rastreamento-e-relatorio
    porque: Sem pixel e conversões configurados, a otimização trabalha no escuro. O dado certo é o que deixa o tráfego mostrar retorno.

faq:
  - id: trafego-quanto-investir
    pergunta: Quanto preciso investir por mês?
    resposta: Recomendamos a partir de R$ 1.500 por mês de verba de anúncio, pagos direto à Meta e ao Google. A gestão mensal custa R$ 2.500. Somando os dois, o custo total de entrada fica a partir de R$ 4.000 por mês.
  - id: trafego-tempo-resultado
    pergunta: Em quanto tempo vejo resultado?
    resposta: Campanhas de resposta direta (venda e mensagem) costumam dar sinais claros em 2 a 4 semanas. Campanhas de marca e reconhecimento pedem de 2 a 3 meses de consistência.
  - id: trafego-meta-ou-google
    pergunta: Meta Ads ou Google Ads, qual escolher?
    resposta: Depende de onde o seu cliente está. No Google, você aparece para quem já está procurando o que você vende. Na Meta (Instagram e Facebook), você chega em quem ainda não te conhece. No diagnóstico, olhamos o seu negócio e indicamos por onde começar — e muitas vezes os dois trabalham juntos.
  - id: trafego-dono-conta
    pergunta: Quem é o dono da conta de anúncio?
    resposta: "[CONFIRMAR: titularidade da conta de anúncio]"
  - id: trafego-relatorio
    pergunta: Como é o relatório?
    resposta: Todo mês você recebe um relatório fechado com o que foi investido, quanto voltou em faturamento, quanto custou cada venda e qual foi o retorno — além do que muda na próxima rodada. Veja um [exemplo ilustrativo](/#relatorio).
  - id: trafego-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: Sim. A maioria dos clientes é de outras cidades. O atendimento é 100% remoto, com reuniões por vídeo e aprovações por e-mail.

campanha:
