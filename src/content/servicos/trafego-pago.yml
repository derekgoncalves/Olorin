resposta_curta: >-
  Gestão de tráfego pago é cuidar das campanhas de Meta Ads e Google Ads para que o dinheiro investido
  vire venda, mensagem ou cadastro — e não só alcance. É para quem já anuncia (ou quer começar) e quer saber
  quanto cada real devolveu. A gestão mensal custa R$ 2.500, e recomendamos uma verba de anúncio a partir de
  R$ 1.500 por mês, paga direto às plataformas. Em campanhas de resposta direta, os primeiros sinais claros
  costumam aparecer em 2 a 4 semanas.

dores:
  titulo: Isso acontece com você?
  itens:
    - Você investe todo mês e não sabe dizer quanto custou cada venda.
    - O relatório só mostra alcance e impressão, nunca faturamento.
    - A conta de anúncio virou uma bagunça de campanhas, públicos repetidos e testes sem fim.
    - O anúncio promete uma coisa e o site mostra outra — e a pessoa desiste no meio do caminho.

para_quem:
  e:
    - Quem já anuncia no Instagram, no Facebook ou no Google e quer enxergar o retorno de verdade.
    - Quem vende pelo site, pela loja virtual ou pelo WhatsApp e quer mais pedidos com o mesmo investimento.
    - Quem tem (ou pode ter) pelo menos R$ 1.500 por mês para investir em anúncio, além da gestão.
    - Quem quer o anúncio com a mesma cara do feed, do site e do material impresso.
  nao_e:
    - Quem quer começar a anunciar com menos de R$ 1.500 por mês de verba. Nesse caso, começamos pelo Raio-X.
    - Quem procura resultado garantido ou "viralizar" do dia para a noite.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Estrutura de campanhas e funil
      texto: Campanhas separadas por objetivo — venda, mensagem, cadastro e reconhecimento — para cada real ter uma função clara.
      frequencia: no início do trabalho
      icone: trafego
    - titulo: Públicos e segmentações
      texto: Públicos limpos, sem sobreposição, para o anúncio chegar em quem tem cara de cliente.
      frequencia: ajustados na otimização semanal
      icone: dados
    - titulo: Criativos alinhados à marca
      texto: Peças de anúncio feitas pelo nosso próprio time de criação, com a mesma cara do feed e do site.
      icone: marca
    - titulo: Otimização semanal
      texto: Ajuste de verba, públicos e anúncios com base no que está vendendo — não no achismo.
      frequencia: toda semana
      icone: relogio
    - titulo: Relatório mensal com retorno
      texto: Faturamento, custo e retorno de cada campanha, em linguagem simples, com o que muda na próxima rodada.
      frequencia: todo mês
      icone: dados
    - titulo: Rastreamento correto
      texto: Pixel, conversões e eventos configurados para o dado chegar certo. Veja [Rastreamento e relatório](/servicos/rastreamento-e-relatorio/).
      icone: site

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Diagnóstico
      texto: Olhamos a conta de anúncio, o histórico das campanhas, o site e o rastreamento. Descobrimos onde o dinheiro está escapando antes de mexer em qualquer coisa.
    - nome: Direção
      texto: Definimos o objetivo de cada campanha, para quem falar e quanto investir em cada frente. Você aprova o plano antes de ir ao ar.
    - nome: Execução
      texto: Campanhas no ar com criativos do nosso time, públicos limpos e otimização toda semana.
    - nome: Leitura
      texto: Todo mês, um relatório com quanto entrou, quanto saiu, qual foi o retorno e o que muda na próxima rodada.
  prazos:
    - "[CONFIRMAR: o que acontece nos primeiros 30 dias]"
    - "[CONFIRMAR: o que acontece até os 60 dias]"
    - "[CONFIRMAR: o que acontece até os 90 dias]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Acesso à conta de anúncio da Meta e/ou do Google Ads (ou ajuda para criar uma).
    - Acesso ao site ou à loja virtual para conferir o rastreamento.
    - "[CONFIRMAR: materiais e informações pedidos no início (fotos, catálogo, margens)]"
    - Aprovação dos criativos e do plano de campanhas antes de irem ao ar.

preco:
  titulo: Quanto custa
  formato: Gestão mensal
  valor: R$ 2.500/mês
  detalhe: Valor da gestão. A verba de anúncio é investida à parte, direto nas plataformas Meta e Google — recomendamos a partir de R$ 1.500/mês.
  total: "Custo total de entrada: a partir de R$ 4.000/mês (gestão + verba mínima recomendada)."
