slug: trafego-pago
ordem: 1
nome: Tráfego pago
chip: Tráfego pago            # igual à opção do formulário e à lista do enviar.php
icone: trafego
janela: campanhas.exe
atualizado: "2026-10-13"
quem_faz: [natalia-arruda]

seo:
  title: Gestão de Tráfego Pago em Curitiba | Olorin Digital
  description: Campanhas de Meta Ads e Google Ads com otimização semanal e relatório que mostra o retorno. Gestão a partir de R$ 2.500/mês.

card:
  titulo: Tráfego pago
  resumo: Meta Ads e Google Ads para venda, mensagem e cadastro, com otimização toda semana.
  resumo_curto: Meta Ads e Google Ads com otimização semanal.

hero:
  eyebrow: Gestão de tráfego pago em Curitiba e para todo o Brasil
  h1: Tráfego pago que mostra quanto cada real investido devolveu.
  sub: Meta Ads e Google Ads para venda, mensagem e cadastro, com otimização toda semana e relatório todo mês.
  janela_linhas:
    - Campanha de venda · no ar
    - Otimização · toda semana
    - Relatório · todo mês

resposta_curta: >-
  Gestão de tráfego pago é cuidar dos seus anúncios na Meta (Instagram e Facebook) e no Google para o
  investimento virar venda, mensagem ou cadastro. A Gestão mensal custa R$ 2.500/mês, mais R$ 1.000 de
  implantação. A verba de anúncio é à parte, a partir de R$ 1.500/mês. Em campanhas de venda, os primeiros
  sinais costumam vir em 2 a 4 semanas.

dores:
  titulo: Isso acontece com você?
  itens:
    - Você investe todo mês e não sabe quanto custou cada venda.
    - O relatório mostra alcance e impressões, nunca faturamento.
    - A conta de anúncio virou uma bagunça de campanhas e públicos repetidos.
    - O anúncio promete uma coisa, o site mostra outra, e a pessoa desiste.

para_quem:
  e:
    - Quem já anuncia e quer saber quanto cada campanha devolveu.
    - Quem vende pelo site ou pelo WhatsApp e quer mais pedidos com o mesmo investimento.
  nao_e:
    - Quem tem menos de R$ 1.500 por mês para anúncio, além da gestão. Comece pelo Raio-X Olorin, que é gratuito.
    - Quem procura resultado garantido ou quer "viralizar" do dia para a noite.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Estrutura de campanhas e funil
      texto: "Campanhas separadas por objetivo: venda, mensagem, cadastro ou reconhecimento."
      frequencia: no início do trabalho
      icone: trafego
    - titulo: Públicos e segmentações
      texto: Públicos limpos, sem sobreposição, para chegar em quem tem cara de cliente.
      frequencia: ajustados toda semana
      icone: dados
    - titulo: Peças de anúncio com a cara da marca
      texto: "Feitas pelo nosso time, com a cara do feed e do site: 8 por mês na Gestão mensal, 15 no 360 completo."
      frequencia: todo mês
      icone: marca
    - titulo: Otimização semanal
      texto: Verba, públicos e anúncios ajustados pelo que vende, e não no achismo.
      frequencia: toda semana
      icone: relogio
    - titulo: Relatório mensal com retorno
      texto: Faturamento, custo e retorno de cada campanha, em linguagem simples. Veja um [exemplo ilustrativo](/como-trabalhamos/#relatorio).
      frequencia: todo mês
      icone: dados
    - titulo: Rastreamento correto
      texto: Pixel e conversões configurados na implantação, para o dado chegar certo.
      icone: site

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Raio-X
      texto: Olhamos conta de anúncio, site e rastreamento para achar onde o dinheiro escapa.
    - nome: Direção
      texto: Definimos objetivo, público e verba de cada campanha. Você aprova antes de ir ao ar.
    - nome: Execução
      texto: Campanhas no ar, peças do nosso time e otimização toda semana.
    - nome: Leitura
      texto: "Todo mês: quanto entrou, quanto saiu e o que muda."
  prazos:
    - "[CONFIRMAR: o que acontece nos primeiros 30 dias]"
    - "[CONFIRMAR: o que acontece até os 60 dias]"
    - "[CONFIRMAR: o que acontece até os 90 dias]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Acesso à conta de anúncio da Meta ou do Google (se não tiver, ajudamos a criar).
    - Acesso ao site para conferir o rastreamento.
    - "[CONFIRMAR: materiais e informações pedidos no início (fotos, catálogo, margens)]"
    - Aprovação das peças e do plano antes de irem ao ar.

preco:
  titulo: Quanto custa
  formato: Gestão mensal
  valor: R$ 2.500/mês
  detalhe: Mais R$ 1.000 de implantação, paga uma vez. A verba de anúncio é à parte, direto na Meta ou no Google, a partir de R$ 1.500/mês.
  total: "Custo total de entrada: a partir de R$ 4.000/mês (gestão + verba mínima recomendada)."
  contrato: Contrato mínimo de 3 meses. Depois, mês a mês com aviso de 30 dias, sem multa.
  inclui:
    - Anúncios na Meta ou no Google
    - 8 peças de anúncio e 8 posts no feed por mês
    - Otimização semanal das campanhas
    - Relatório mensal e reunião de 30 minutos
  nao_inclui:
    - A verba de anúncio
    - Meta e Google ao mesmo tempo (no [360 completo](/planos/))
    - Site, loja e impresso (à parte ou no 360 completo)
  schema:
    valor: "2500"
    unidade: MON
    descricao: Gestão mensal de tráfego pago (Meta Ads ou Google Ads), com implantação única de R$ 1.000. Verba de anúncio à parte.

combina_com:
  - slug: redes-sociais
    porque: O anúncio vende mais quando o feed confirma o que ele promete. Na Gestão mensal, os dois andam juntos.
  - slug: rastreamento-e-relatorio
    porque: Sem pixel e conversões, a otimização trabalha no escuro.

faq:
  - id: trafego-quanto-investir
    pergunta: Quanto preciso investir por mês?
    resposta: "A gestão custa R$ 2.500/mês, mais R$ 1.000 de implantação. A verba vai direto para a Meta ou o Google, a partir de R$ 1.500/mês. Quer testar antes? O Arranque 30 dias custa a partir de R$ 1.800, uma vez: 1 campanha, rastreamento, 8 peças e relatório no dia 30, sem contrato mensal. Se continuar, o valor é abatido da implantação."
  - id: trafego-tempo-resultado
    pergunta: Em quanto tempo vejo resultado?
    resposta: Campanhas de venda e de mensagem costumam dar sinais claros em 2 a 4 semanas. Campanhas de marca pedem de 2 a 3 meses.
  - id: trafego-meta-ou-google
    pergunta: Meta Ads ou Google Ads, qual escolher?
    resposta: Depende de onde está o seu cliente. No Google, você aparece para quem já procura o que vende. Na Meta, chega em quem ainda não te conhece. A Gestão mensal cobre um dos dois; o 360 completo, os dois.
  - id: trafego-dono-conta
    pergunta: Quem é o dono da conta de anúncio?
    resposta: "[CONFIRMAR: titularidade da conta de anúncio]"
  - id: trafego-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A maioria dos clientes é de fora de Curitiba. Tudo é feito a distância: WhatsApp, reuniões por vídeo e aprovações por e-mail."

campanha:
  titulo: Pare de pagar anúncio que não volta.
  subtitulo: Raio-X Olorin gratuito da sua conta de anúncio, com 30 minutos por vídeo e um PDF com o que mais trava a sua venda. Sem compromisso.
  faq: [trafego-quanto-investir, trafego-tempo-resultado, trafego-meta-ou-google, trafego-fora-curitiba]
