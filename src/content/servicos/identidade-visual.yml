resposta_curta: >-
  Identidade visual é o conjunto que faz a sua marca ser reconhecida: logotipo, cores, tipografia e as regras
  de uso. Na Olorin, o projeto começa por uma imersão no seu negócio, tem rodadas de ajuste toda semana e
  termina com o manual e os arquivos finais em todos os formatos. O escopo e o prazo são fechados na proposta.

o_que_e:
  titulo: Reconhecida de longe.
  texto:
    - Identidade visual não é só o logo. É o conjunto de cores, letras, formas e regras que faz alguém reconhecer a sua marca antes mesmo de ler o nome.
    - "A Olorin começa entendendo o seu negócio, o seu público e os seus concorrentes. Depois desenha o logotipo e as variações, escolhe a paleta e a tipografia e organiza tudo num manual simples, para qualquer fornecedor aplicar do jeito certo."
    - "O resultado é uma marca que funciona pequena no avatar, grande na fachada e igual em todo lugar: no anúncio, no feed, no site e no cartão."
  destaques:
    - Logotipo com versões para cada uso
    - Paleta e tipografia definidas
    - Manual de marca fácil de seguir

dores:
  etiqueta: Este é o seu caso?
  titulo: Marca com várias caras?
  texto: Se um destes aparece aí, a sua marca está perdendo força.
  itens:
    - { titulo: Cada lugar uma marca, texto: "O feed, o cartão e o site parecem de empresas diferentes." }
    - { titulo: Logo que não cabe, texto: "O logo some no avatar do Instagram e fica estranho em fundo escuro." }
    - { titulo: Sem regra, texto: "Cada fornecedor usa uma cor e uma letra, porque ninguém tem o manual." }
    - { titulo: Cara de improviso, texto: A marca parece menor do que o negócio que você construiu. }

