slug: identidade-visual
ordem: 3
nome: Identidade visual e criação
chip: Identidade visual e criação   # igual à opção do formulário e à lista do enviar.php
icone: marca
janela: marca.ai
atualizado: "2026-10-13"
quem_faz: [vinicius-mafra]

seo:
  title: Criação de Identidade Visual em Curitiba | Olorin Digital
  description: Logotipo, manual de marca, papelaria e todo o material visual. Uma marca com cara de marca, não de improviso. Projetos a partir de R$ 800.

card:
  titulo: Identidade visual e criação
  resumo: Logotipo, manual de marca, papelaria e material de apoio. A marca com cara de marca, não de improviso.
  resumo_curto: Logotipo, manual de marca e papelaria.

hero:
  eyebrow: Criação de identidade visual em Curitiba e para todo o Brasil
  h1: A marca com cara de marca, não de improviso.
  sub: Logotipo, manual de marca, papelaria e material de apoio, criados pelo mesmo time dos seus anúncios, posts, site e impressos.
  janela_linhas:
    - Logotipo · versão final
    - Manual de marca · cores e fontes
    - Papelaria · pronta para a gráfica

resposta_curta: >-
  Identidade visual é o que dá cara à sua marca: logotipo, cores, fontes e o manual que explica como usar
  tudo isso. É para quem está começando ou sente que a marca parece diferente em cada lugar. Os projetos
  custam a partir de R$ 800, sem mensalidade. Escopo, prazo e preço ficam definidos no briefing, a conversa
  em que combinamos o projeto, antes de começar.

dores:
  titulo: Isso acontece com você?
  itens:
    - "Cada peça parece de uma empresa diferente: o anúncio, o feed, o cartão e o site."
    - O logotipo foi feito às pressas, e ninguém sabe qual versão é a certa.
    - Cada fornecedor usa uma cor e uma fonte, porque não existe um guia da marca.
    - O impresso parou no tempo enquanto o digital foi atualizado.

para_quem:
  e:
    - Quem está abrindo um negócio e quer começar com uma marca de verdade.
    - Quem sente que a marca parece diferente em cada lugar.
    - Quem vai investir em anúncio, site ou impresso e quer tudo com a mesma cara.
    - Quem prefere uma entrega fechada, com escopo e prazo definidos antes.
  nao_e:
    - Quem precisa de um projeto por menos de R$ 800.
    - Quem procura gráfica. Entregamos o arquivo pronto para imprimir.
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Logotipo
      texto: Pensado para funcionar no digital e no impresso.
      icone: marca
    - titulo: Manual de marca
      texto: O guia de como usar logotipo, cores e fontes em qualquer peça criada depois.
      icone: estrela
    - titulo: Papelaria
      texto: Cartão de visita e outras peças do dia a dia, em arquivo fechado, pronto para a gráfica.
      icone: impresso
    - titulo: Material visual de apoio
      texto: Outras peças que o seu negócio precisar, combinadas no briefing.
      icone: redes

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Raio-X
      texto: Olhamos o que a marca já tem, do logotipo ao impresso, para entender o que trava e o que vale manter.
    - nome: Direção
      texto: No briefing, combinamos escopo, prazo e o que a marca precisa transmitir, para quem e onde.
    - nome: Execução
      texto: O Vinicius cria o logotipo, o manual e as peças combinadas. Você aprova por e-mail.
    - nome: Leitura
      texto: Você recebe a marca e o manual para usá-la sem segredo. Se seguir com a gente, o mesmo time aplica a marca nos anúncios, no conteúdo, no site e no impresso.
  prazos:
    - "[CONFIRMAR: prazo típico de cada etapa de um projeto de identidade visual (diagnóstico, criação, ajustes e entrega)]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Um tempo para o briefing, em que definimos juntos o escopo e o prazo.
    - "O que a marca já tem, se houver: logotipo, impressos e os links das redes e do site."
    - Retorno nas aprovações por e-mail, para o projeto não travar.
    - "[CONFIRMAR: número de rodadas de ajuste incluídas e outros materiais pedidos no início]"

preco:
  titulo: Quanto custa
  formato: Projeto pontual
  valor: A partir de R$ 800/projeto
  faixa: "[CONFIRMAR: faixa de preço por escopo (só logotipo; logotipo + manual de marca; identidade completa com papelaria)]"
  detalhe: Escopo e prazo são definidos no briefing, e o preço vem detalhado na proposta, antes de começar.
  contrato: Projeto fechado, sem mensalidade.
  inclui:
    - Logotipo, manual de marca, papelaria e material de apoio, conforme o briefing
    - Criação do nosso time, sem terceirizar
    - "[CONFIRMAR: rodadas de ajuste incluídas e formatos dos arquivos entregues]"
  nao_inclui:
    - A impressão (entregamos o arquivo pronto para a gráfica)
    - Anúncios, redes sociais e site (à parte ou nos [planos mensais](/planos/))
  schema:
    valor: "800"
    minimo: true
    descricao: Projeto pontual de identidade visual, a partir de R$ 800.

combina_com:
  - slug: material-impresso
    porque: Com a marca pronta, cartão, folder, catálogo e fachada saem com a mesma cara.
  - slug: site-e-loja-virtual
    porque: Feito pelo mesmo time, o site já nasce com as cores e as fontes do manual.

faq:
  - id: identidade-quanto-custa
    pergunta: Quanto custa uma identidade visual?
    resposta: A partir de R$ 800. O valor final depende do escopo, combinado no briefing, e vem detalhado na proposta antes de começar.
  - id: identidade-prazo
    pergunta: Quanto tempo leva para a marca ficar pronta?
    resposta: Depende do tamanho do projeto. O prazo é definido no briefing, junto com o escopo, antes de você fechar.
  - id: identidade-quem-cria
    pergunta: Quem cria a minha marca?
    resposta: O Vinicius Mafra, diretor de arte e designer há mais de 10 anos. Ele já esteve à frente de projetos de influenciadores digitais a produções culturais. Não terceirizamos.
  - id: identidade-mesma-cara
    pergunta: A marca nova já sai aplicada no anúncio, no feed e no site?
    resposta: "Sim, se você contratar esses serviços com a gente: o mesmo time faz marca, posts, anúncios, site e impresso. Também dá para começar só pela identidade e expandir depois."
  - id: identidade-arquivos
    pergunta: Quem fica com os arquivos da marca?
    resposta: "[CONFIRMAR: titularidade e formatos dos arquivos entregues (arquivos abertos, vetor, PNG, PDF)]"
  - id: identidade-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A maioria dos clientes é de fora de Curitiba. Tudo é feito a distância: WhatsApp, reuniões por vídeo, aprovações por e-mail e arquivos entregues pela internet."

campanha:
  titulo: Chega de marca feita no improviso.
  subtitulo: Raio-X Olorin gratuito da sua marca, com 30 minutos por vídeo e um PDF com o que mais trava a sua venda. Projetos a partir de R$ 800. Sem compromisso.
  faq: [identidade-quanto-custa, identidade-prazo, identidade-quem-cria, identidade-fora-curitiba]
