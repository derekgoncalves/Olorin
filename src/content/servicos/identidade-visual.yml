precisamos:
  titulo: Para começar, precisamos de
  itens:
    - Uma conversa de briefing sobre o negócio e o público.
    - A marca atual e materiais antigos, se existirem.
    - Exemplos de marcas que você admira (e das que não gosta).

para_quem:
  e:
    - Quem está abrindo um negócio e quer começar com cara de marca.
    - Quem cresceu e sente que a marca ficou pequena para a empresa.
    - Quem vai investir em anúncio, site ou fachada e quer tudo com a mesma cara.
  nao_e:
    - Quem precisa só de um ajuste rápido num arquivo que já existe (aí é uma peça avulsa).
    - Quem quer copiar a marca de outra empresa.

