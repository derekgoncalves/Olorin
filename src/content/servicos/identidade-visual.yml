    - { nome: Execução, texto: "Logotipo, paleta, tipografia e aplicações, com rodadas de ajuste toda semana." }
    - { nome: Leitura, texto: "Manual e arquivos finais entregues, com a marca aplicada no dia a dia." }
  prazos_titulo: Prazo do projeto
