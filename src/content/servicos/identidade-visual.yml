combina_com:
  - slug: material-impresso
    porque: Com a identidade pronta, cartão, folder e fachada saem com a mesma cara.
  - slug: redes-sociais
    porque: O feed é onde a marca aparece todo dia. Com identidade clara, cada post sai mais rápido.

faq:
  - id: identidade-prazo
    pergunta: Quanto tempo leva uma identidade visual?
    resposta: A primeira versão sai em cerca de 7 dias úteis, em média. Depois, as rodadas de ajuste são semanais até a aprovação. O prazo exato do seu projeto sai na proposta.
  - id: identidade-ajustes
    pergunta: E se eu não gostar da primeira versão?
    resposta: O projeto prevê rodadas de ajuste toda semana. E a direção criativa é aprovada antes de desenhar, para ninguém se surpreender no fim.
  - id: identidade-arquivos
    pergunta: Os arquivos ficam comigo?
    resposta: "Sim. Você recebe todos os arquivos finais, em vetor, PNG e SVG, e pode usar com qualquer fornecedor."
  - id: identidade-redesign
    pergunta: Vocês renovam uma marca que já existe?
    resposta: Sim. Muitas vezes vale manter o que o público já reconhece e modernizar o resto. No Raio-X, a gente mostra o que fica e o que muda.

campanha:
  titulo: Sua marca tem cara de improviso?
  subtitulo: Raio-X gratuito da sua marca, com 30 minutos por vídeo e um PDF com o que trava a sua imagem. Sem compromisso.
  faq: [identidade-prazo, identidade-ajustes, identidade-arquivos, identidade-redesign]
