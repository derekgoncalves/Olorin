combina_com:
  - slug: rastreamento-e-relatorio
    porque: O site já sai com o rastreamento configurado. Com o painel de acompanhamento, você vê quanto entrou, quanto saiu e qual foi o retorno — não só quantas visitas chegaram.
  - slug: trafego-pago
    porque: O anúncio leva a pessoa até o site, e o site precisa confirmar o que o anúncio prometeu. A Natália Arruda cuida das campanhas, e o mesmo time faz o anúncio e o site com a mesma cara.

faq:
  - id: site-quanto-custa
    pergunta: Quanto custa um site ou uma loja virtual?
    resposta: Os projetos começam em R$ 800, no plano Pontual. O valor final depende do escopo — por exemplo, se é uma página de captação, um site institucional ou uma loja virtual. Tudo é combinado no briefing, e o preço vem aberto na proposta, antes de começar. O site também faz parte do plano 360 completo, por R$ 5.000 por mês.
  - id: site-prazo
    pergunta: Quanto tempo leva para o site ficar pronto?
    resposta: Depende do tamanho do projeto. O prazo é definido no briefing, junto com o escopo, antes de começarmos. Assim, você sabe quando o site vai ficar pronto antes de fechar.
  - id: site-velocidade
    pergunta: Como sei que o site vai ser rápido?
    resposta: Velocidade e acessibilidade são o padrão em todo projeto de site, não um extra. Para ter uma referência, o site anterior da própria Olorin foi medido no PageSpeed — a ferramenta do Google que dá notas de 0 a 100 para a qualidade de uma página. Em 08/10/2026, no celular, ele tirou 97 em desempenho, 100 em acessibilidade, 100 em práticas recomendadas e 100 em SEO (o que ajuda o Google a entender a página).
  - id: site-anuncio
    pergunta: O site já sai pronto para receber anúncio?
    resposta: Sai com o rastreamento configurado, então dá para medir o que acontece depois do clique. Se você anunciar com a gente, a Natália Arruda cuida das campanhas de Meta Ads (Instagram e Facebook) e Google Ads. O anúncio e o site saem do mesmo time, com a mesma cara. A gestão de tráfego pago faz parte da Gestão mensal e do 360 completo.
  - id: site-dono
    pergunta: Quem fica com o domínio, a hospedagem e os arquivos do site?
    resposta: "[CONFIRMAR: titularidade do domínio, da hospedagem e dos arquivos do site, e o que acontece se o cliente encerrar o trabalho]"
  - id: site-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: Sim. A maioria dos clientes é de outras cidades. O atendimento é 100% remoto, com reuniões por vídeo, aprovações por e-mail e entregáveis digitais.

campanha:
  titulo: Chega de site que faz o cliente desistir.
  subtitulo: Diagnóstico gratuito do seu site, dos anúncios e da marca. Projetos de site a partir de R$ 800. Sem compromisso.
  faq: [site-quanto-custa, site-prazo, site-velocidade, site-fora-curitiba]
