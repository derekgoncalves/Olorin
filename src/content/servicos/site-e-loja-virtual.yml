combina_com:
  - slug: rastreamento-e-relatorio
    porque: O site já sai com o rastreamento configurado. Com o painel de acompanhamento, você vê quanto entrou, quanto saiu e qual foi o retorno — não só quantas visitas chegaram.
  - slug: trafego-pago
    porque: O anúncio leva a pessoa até o site, e o site precisa confirmar o que o anúncio prometeu. A Natália Arruda cuida das campanhas, e o mesmo time faz o anúncio e o site com a cara da sua marca.

faq:
  - id: site-quanto-custa
    pergunta: Quanto custa um site ou uma loja virtual?
    resposta: "Os projetos de site começam em R$ 800, no plano Pontual. O valor final depende do escopo — por exemplo, se é uma página de captação, um site institucional ou uma loja virtual. Tudo é combinado no briefing, a conversa em que definimos o projeto antes de começar. O preço vem detalhado na proposta. O site também faz parte do plano 360 completo: R$ 5.000 por mês de gestão, com a verba de anúncio à parte (a partir de R$ 6.500 por mês no total)."
  - id: site-prazo
    pergunta: Quanto tempo leva para o site ficar pronto?
    resposta: Depende do tamanho do projeto. O prazo é definido no briefing, junto com o escopo, antes de começarmos. Assim, você sabe quando o site vai ficar pronto.
  - id: site-velocidade
    pergunta: Como sei que o site vai ser rápido?
    resposta: Velocidade e acessibilidade (o site funcionar também para quem usa leitor de tela ou só o teclado) são o padrão em todo projeto de site, não um extra. Para ter uma referência, o site anterior da própria Olorin foi medido no PageSpeed. É a ferramenta do Google que dá notas de 0 a 100 para a qualidade de uma página. Em 08/10/2026, no celular, ele tirou 97 em desempenho e 100 em acessibilidade, práticas recomendadas e SEO. SEO é o conjunto de cuidados que ajuda a página a aparecer no Google.
  - id: site-anuncio
    pergunta: O site já sai pronto para receber anúncio?
    resposta: Sai com o rastreamento configurado, então dá para medir o que acontece depois do clique. Se você anunciar com a gente, a Natália Arruda cuida das campanhas de Meta Ads (Instagram e Facebook) e Google Ads. O anúncio e o site saem do mesmo time, com a mesma cara. A gestão dos anúncios faz parte dos planos Gestão mensal e 360 completo.
  - id: site-dono
    pergunta: Quem fica com o domínio, a hospedagem e os arquivos do site?
    resposta: "[CONFIRMAR: titularidade do domínio, da hospedagem e dos arquivos do site, e o que acontece se o cliente encerrar o trabalho]"
  - id: site-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: Sim. A maioria dos clientes é de outras cidades. O atendimento é 100% remoto, com reuniões por vídeo, aprovações por e-mail e arquivos entregues pela internet.

campanha:
  titulo: Chega de site que faz o cliente desistir.
  subtitulo: Raio-X gratuito do seu site, dos anúncios e da marca. Projetos de site a partir de R$ 800. Sem compromisso.
  faq: [site-quanto-custa, site-prazo, site-velocidade, site-fora-curitiba]
