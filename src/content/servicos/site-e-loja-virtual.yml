# Resumo usado na landing /promo/ e no JSON-LD (não aparece com rótulo na página do serviço).
resposta_curta: >-
  A Olorin cria site institucional, loja virtual e página de captação: rápidos, bonitos no celular e feitos
  para transformar visita em contato ou venda. Sites a partir de R$ 3.000 e lojas virtuais a partir de
  R$ 10.000, em projeto fechado, com escopo, prazo e preço combinados antes de começar.

o_que_e:
  titulo: Visita que vira contato.
  texto:
    - "O site é para onde o anúncio, o post e a indicação levam a pessoa. Se ele demora, confunde ou não tem a sua cara, o interesse acaba ali, e o dinheiro do anúncio vai junto."
    - A Olorin cria sites institucionais, lojas virtuais e páginas de captação com o mesmo cuidado da sua marca, pensados primeiro para o celular, fáceis de ler, com o botão de contato sempre à mão e a medição configurada desde o primeiro dia.
    - "Escopo, prazo e preço são combinados no briefing, antes de começar. Do site de uma página à loja com catálogo inteiro, com o mesmo cuidado."
  destaques:
    - Rápido no celular
    - A mesma cara da marca
    - Medição desde o primeiro dia

dores:
  titulo: Site que espanta?
  texto: Se um destes aparece aí, o seu site está perdendo cliente.
  itens:
    - { titulo: Lento no celular, texto: "O anúncio leva a pessoa ao site, mas a página demora a abrir, e ela desiste." }
    - { titulo: Botão sumido, texto: No celular o texto fica miúdo e pedir orçamento vira uma maratona. }
    - { titulo: Cara de outra marca, texto: "O site não tem as cores, as fontes e o jeito de falar do feed e do anúncio." }
    - { titulo: Sem medição, texto: Você não sabe quantos contatos ou vendas vieram do site no mês passado. }

entregas:
  titulo: O que entra.
  texto: Do briefing ao site no ar, tudo o que faz a visita virar contato.
  itens:
    - titulo: Site institucional
      texto: Páginas que apresentam a empresa e os serviços e levam a pessoa até o contato.
      frequencia: a partir de R$ 3.000
      icone: site
    - titulo: Loja virtual
      texto: Catálogo, carrinho, pagamento e frete, para vender sem depender de mensagem.
      frequencia: a partir de R$ 10.000
      icone: estrela
    - titulo: Página de captação
      texto: Uma página só para a oferta ou a campanha, feita para receber quem clica no anúncio.
      frequencia: no projeto ou à parte
      icone: trafego
    - titulo: Celular primeiro
      texto: Desenho pensado primeiro para a tela pequena, onde está a maior parte das visitas.
      frequencia: em todas as páginas
      icone: redes
    - titulo: Velocidade e acessibilidade
      texto: Imagens leves, texto legível e navegação por teclado, como padrão e não como extra.
      frequencia: conferidas antes de publicar
      icone: relogio
    - titulo: Medição configurada
      texto: Google Analytics, pixel e conversões, para saber de onde veio cada contato e cada venda.
      frequencia: na publicação
      icone: dados

portfolio:
  titulo: Na prática.
  texto: Sites e páginas que a Olorin já colocou no ar.

como_funciona:
  titulo: Do briefing ao ar.
  etapas:
    - { nome: Briefing, texto: "Conversamos sobre objetivo, público e conteúdo, e fechamos escopo, prazo e preço." }
    - { nome: Desenho, texto: Você vê o site no celular e no computador e aprova antes da construção. }
    - { nome: Construção, texto: "Páginas montadas, textos no lugar, medição configurada e testes de velocidade." }
    - { nome: Publicação, texto: "Site no ar, conferido de ponta a ponta, e a primeira leitura das visitas." }
  prazos_titulo: Prazo de cada projeto
  prazos_janela: prazos.txt
  # PENDENTE: confirmar os prazos típicos de site, loja virtual e página de captação
  prazos:
    - "Página de captação: de 1 a 2 semanas, do briefing ao ar."
    - "Site institucional: de 3 a 6 semanas, conforme o número de páginas."
    - "Loja virtual: de 6 a 10 semanas, conforme o catálogo e as integrações."

precisamos:
  titulo: Para começar, precisamos de
  itens:
    - Acesso ao domínio e à hospedagem (se não tiver, a gente ajuda a contratar).
    # PENDENTE: confirmar quem escreve os textos do site (cliente ou Olorin) e se entra no preço
    - "Textos, fotos e a lista de produtos ou serviços, ou o combinado de que a Olorin escreve."
    - Aprovação do desenho antes da construção.

para_quem:
  e:
    - Quem anuncia e precisa de um site rápido e claro para receber quem clica.
    - Quem quer vender pela internet com uma loja virtual.
    - Quem vai lançar uma oferta e precisa de uma página só para ela.
  nao_e:
    - Quem procura um site por menos de R$ 3.000 ou uma loja por menos de R$ 10.000.
    - Quem quer um site só para dizer que tem um, sem objetivo de contato ou de venda.

preco:
  titulo: Preço aberto.
  formato: Projeto de site
  rotulo: A partir de
  valor: R$ 3.000
  detalhe: "Site institucional e página de captação a partir de R$ 3.000; loja virtual a partir de R$ 10.000. Projeto fechado: escopo, prazo e preço combinados no briefing, antes de começar. No Marketing 360, o site entra no mesmo pacote do anúncio e das redes."
  contrato: Projeto fechado, sem mensalidade obrigatória.
  inclui:
    - Desenho no celular e no computador
    - Construção e publicação
    - Velocidade e acessibilidade conferidas
    - Medição de visitas e contatos
  # PENDENTE: confirmar o que fica de fora do projeto de site (domínio, hospedagem, plataforma da loja, manutenção)
  nao_inclui:
    - Domínio e hospedagem (ficam no seu nome)
    - Mensalidade da plataforma da loja e taxas de pagamento
    - Manutenção mensal depois da entrega (à parte)
  schema:
    valor: "3000"
    minimo: true
    descricao: Criação de site institucional a partir de R$ 3.000 e de loja virtual a partir de R$ 10.000, em projeto fechado.

combina_com:
  - slug: trafego-pago
    porque: O site recebe quem clica. Com tráfego pago, quem clica tem cara de cliente.
  - slug: rastreamento-e-relatorio
    porque: Com a medição certa, você sabe quanto cada página trouxe de contato e de venda.

faq:
  - id: site-quanto-custa
    pergunta: Quanto custa um site?
    resposta: "Site institucional ou página de captação a partir de R$ 3.000 e loja virtual a partir de R$ 10.000. O preço final sai no briefing, com escopo e prazo fechados antes de começar."
  # PENDENTE: confirmar os prazos típicos de cada projeto
  - id: site-prazo
    pergunta: Quanto tempo leva?
    resposta: "Uma página de captação leva de 1 a 2 semanas; um site institucional, de 3 a 6; uma loja virtual, de 6 a 10. O prazo do seu projeto sai no briefing."
  - id: site-velocidade
    pergunta: O site vai ser rápido no celular?
    resposta: "Sim. Velocidade e acessibilidade são o padrão: imagens leves, texto legível, navegação por teclado e conferência antes de publicar."
  - id: site-anuncio
    pergunta: Vocês fazem o anúncio para o site?
    resposta: "Sim. O [tráfego pago](/servicos/trafego-pago/) é coordenado pelo mesmo time, então o anúncio e o site falam a mesma língua."
  # PENDENTE: confirmar a titularidade do domínio, da hospedagem e dos arquivos do site
  - id: site-dono
    pergunta: De quem é o site?
    resposta: Seu. Domínio, hospedagem e arquivos ficam no seu nome. Se um dia o trabalho acabar, tudo continua com você.
  - id: site-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A Olorin atende todo o Brasil a distância: WhatsApp, reunião por vídeo e aprovação por e-mail."

campanha:
  titulo: Chega de site que espanta cliente.
  subtitulo: Raio-X gratuito do seu site, com 30 minutos por vídeo e um PDF com o que mais trava o contato. Sites a partir de R$ 3.000. Sem compromisso.
  faq: [site-quanto-custa, site-prazo, site-velocidade, site-fora-curitiba]
