  title: Criação de Sites e Lojas Virtuais em Curitiba | Olorin
  description: Site institucional, loja virtual e página de captação rápidos, bonitos no celular e feitos para trazer contato e venda. Sites a partir de R$ 800.

card:
  titulo: Sites
  resumo: Site institucional, loja virtual e página de captação. Rápidos, bonitos no celular e feitos para trazer contato e venda.
  resumo_curto: Site institucional, loja virtual e página de captação.

hero:
  eyebrow: Criação de sites e lojas virtuais em Curitiba e para todo o Brasil
  h1: Site rápido, bonito no celular e feito para trazer cliente.
  sub: Site institucional, loja virtual e página de captação com a cara da sua marca, feitos pelo mesmo time do anúncio e do conteúdo. Velocidade e acessibilidade são o padrão, não um extra.
  janela_linhas:
    - Site institucional · no ar
    - Versão do celular · aprovada
    - Medição de visitas · configurada

resposta_curta: >-
  Criamos site institucional, loja virtual e página de captação: rápidos, bonitos no celular e feitos para
  transformar visita em contato ou venda. É para quem anuncia, vende pela internet ou quer um site com a
  mesma cara do resto da marca. Os projetos começam em R$ 800, no plano Pontual. Escopo e prazo são
  definidos no briefing (a conversa em que combinamos o projeto), antes de começar.

dores:
  titulo: Isso acontece com você?
  itens:
    - O anúncio leva a pessoa ao site, mas a página demora a abrir no celular, e ela desiste.
    - No celular, o texto fica miúdo, o botão some e pedir orçamento vira uma maratona.
    - O site não tem as cores, as fontes e o jeito de falar do feed e do anúncio.
    - Você não sabe quantos contatos ou vendas vieram do site no mês passado.

para_quem:
  e:
    - Quem anuncia e precisa de um site rápido e claro para receber quem clica.
    - Quem quer vender pela internet com uma loja virtual.
    - Quem vai lançar uma oferta e precisa de uma página só para ela.
    - Quem prefere uma entrega fechada, com escopo e prazo definidos antes.
  nao_e:
    - Quem precisa de um projeto por menos de R$ 800.
    - "[CONFIRMAR: Quem quer um site só para dizer que tem um. O nosso lema é outro: não é sobre aparecer, é sobre vender.]"
    - "[CONFIRMAR: outros critérios de quem não é cliente ideal para sites e lojas]"

entregas:
  titulo: O que entregamos
  itens:
    - titulo: Site institucional
      texto: Quem vocês são, o que fazem e como falar com vocês, organizado para levar a visita até o contato.
      icone: site
    - titulo: Loja virtual
      texto: O seu cliente escolhe o produto e compra sem se perder no caminho.
      icone: estrela
    - titulo: Página de captação
      texto: "Uma página só, para uma oferta, com um objetivo: fazer a pessoa deixar o contato. É para onde o anúncio manda quem clica."
      icone: seta
    - titulo: Rastreamento configurado
      texto: O site já sai contando visitas, contatos e pedidos. Para ir além, veja [Rastreamento e relatório](/servicos/rastreamento-e-relatorio/).
      icone: dados
    - titulo: Velocidade e acessibilidade como padrão
      texto: Páginas leves no celular, que funcionam também com leitor de tela ou só pelo teclado.
      icone: relogio
    - titulo: A mesma cara da sua marca
      texto: Logotipo, cores e fontes iguais aos do anúncio, do feed e do impresso.
      icone: marca

como_funciona:
  titulo: Como funciona
  etapas:
    - nome: Raio-X
      texto: Olhamos o site atual, os anúncios e as redes para achar onde a pessoa trava antes do contato ou da compra.
    - nome: Direção
      texto: "No briefing, combinamos escopo, prazo e o papel de cada página: o que dizer, para quem e o que a pessoa deve fazer ali."
    - nome: Execução
      texto: Criamos o site, leve no celular e com o rastreamento configurado. Você aprova por e-mail.
    - nome: Leitura
      texto: Você vê o que acontece depois do clique. Na Gestão mensal ou no 360 completo, isso vira relatório todo mês.
  prazos:
    - "[CONFIRMAR: prazo típico de cada etapa de um projeto de site ou loja virtual (briefing, criação, ajustes e publicação)]"

precisamos:
  titulo: O que precisamos de você
  itens:
    - Um tempo para o briefing, em que definimos juntos o escopo e o prazo.
    - "O que a marca já tem: logotipo, manual de marca, fotos e o site atual, se existir."
    - Para a loja virtual, fotos, preços e descrições dos produtos.
    - Retorno nas aprovações por e-mail, para o projeto não travar.
    - "[CONFIRMAR: quem escreve os textos do site e quais acessos pedimos no início (domínio, hospedagem, site atual)]"

preco:
  titulo: Quanto custa
  formato: Plano Pontual
  valor: A partir de R$ 800/projeto
  faixa: "Site e página de captação a partir de R$ 800. Loja virtual (e-commerce) a partir de R$ 10.000."
  detalhe: Escopo e prazo são definidos no briefing, e o preço vem detalhado na proposta, antes de começar. O site também faz parte do [360 completo](/planos/).
  inclui:
    - Site institucional, loja virtual ou página de captação, conforme o briefing
    - Velocidade e acessibilidade no celular
    - Rastreamento configurado
    - "[CONFIRMAR: rodadas de ajuste incluídas, plataforma da loja virtual e se o cliente consegue atualizar o site e cadastrar produtos sozinho]"
  nao_inclui:
    - Anúncios e redes sociais (na Gestão mensal ou no 360 completo)
    - Material impresso (à parte ou no 360 completo)
    - "[CONFIRMAR: hospedagem, domínio e manutenção depois da entrega — inclusos ou à parte]"
  schema:
    valor: "800"
    minimo: true
    descricao: Projeto pontual de site, a partir de R$ 800.

combina_com:
  - slug: rastreamento-e-relatorio
    porque: Com o painel, você vê quanto entrou, quanto saiu e qual foi o retorno, e não só quantas visitas chegaram.
  - slug: trafego-pago
    porque: O site confirma o que o anúncio prometeu. A Natália Arruda cuida das campanhas, e o mesmo time faz o anúncio e o site.

faq:
  - id: site-quanto-custa
    pergunta: Quanto custa um site ou uma loja virtual?
    resposta: "Site institucional e página de captação a partir de R$ 800, no plano Pontual. Loja virtual (e-commerce) a partir de R$ 10.000. O preço vem detalhado na proposta, antes de começar. O site também faz parte do [360 completo](/planos/): R$ 5.000/mês, mais R$ 1.500 de implantação e a verba de anúncio à parte."
  - id: site-prazo
    pergunta: Quanto tempo leva para o site ficar pronto?
    resposta: Depende do tamanho do projeto. O prazo é definido no briefing, junto com o escopo, antes de começarmos.
  - id: site-velocidade
    pergunta: Como sei que o site vai ser rápido?
    resposta: Velocidade e acessibilidade são o padrão em todo projeto. Como referência, o site anterior da Olorin foi medido em 08/10/2026 no PageSpeed, a ferramenta do Google que dá notas de 0 a 100. No celular, tirou 97 em desempenho e 100 em acessibilidade.
  - id: site-anuncio
    pergunta: O site já sai pronto para receber anúncio?
    resposta: Sai com o rastreamento configurado, então dá para medir o que acontece depois do clique. Se você anunciar com a gente, a Natália Arruda cuida das campanhas, e o anúncio sai com a cara do site.
  - id: site-dono
    pergunta: Quem fica com o domínio, a hospedagem e os arquivos do site?
    resposta: "[CONFIRMAR: titularidade do domínio, da hospedagem e dos arquivos do site, e o que acontece se o cliente encerrar o trabalho]"
  - id: site-fora-curitiba
    pergunta: Vocês atendem fora de Curitiba?
    resposta: "Sim. A maioria dos clientes é de fora de Curitiba. Tudo é feito a distância: WhatsApp, reuniões por vídeo, aprovações por e-mail e arquivos entregues pela internet."

campanha:
  titulo: Chega de site que faz o cliente desistir.
  subtitulo: Raio-X Olorin gratuito do seu site, dos anúncios e da marca, com 30 minutos por vídeo e um PDF com o que mais trava a sua venda. Projetos a partir de R$ 800. Sem compromisso.
  faq: [site-quanto-custa, site-prazo, site-velocidade, site-fora-curitiba]
